[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-aware-core"
version = "0.1.0"
description = "Framework-neutral contracts and deterministic invariants for Energy-Aware systems"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["pydantic>=2.6,<3"]
license = {text = "MIT"}
authors = [{name = "Gonzalo / AI Engineer LIDR"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eacore = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["I001", "UP017", "UP035"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
