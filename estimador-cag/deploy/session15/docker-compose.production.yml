services:
  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set PUBLIC_HOST to the public DNS name}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      ai_service:
        condition: service_healthy
    networks:
      - edge
      - internal

  ai_service:
    image: ${ESTIMADOR_IMAGE:?Set ESTIMADOR_IMAGE to an immutable image digest}
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: 45s
    environment:
      GIT_SHA: ${GIT_SHA:-unknown}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to durable external PostgreSQL}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL to the runtime Redis endpoint}
      ESTIMATOR_SESSION_SIGNING_KEY: ${ESTIMATOR_SESSION_SIGNING_KEY:?Set ESTIMATOR_SESSION_SIGNING_KEY to a high-entropy secret of at least 32 bytes}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      PROVIDER_BENCHMARK_SNAPSHOT_PATH: ${PROVIDER_BENCHMARK_SNAPSHOT_PATH:-artifacts/provider-readiness/provider-benchmark-snapshot.json}
      GRAPH_RETRIEVAL_MODE: ${GRAPH_RETRIEVAL_MODE:-parallel}
      GRAPH_RETRIEVAL_MAX_CONCURRENCY: ${GRAPH_RETRIEVAL_MAX_CONCURRENCY:-4}
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    networks:
      - internal

networks:
  edge:
  internal:
    internal: true

volumes:
  caddy_data:
  caddy_config:
