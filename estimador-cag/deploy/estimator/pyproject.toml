[project]
name = "energy-aware-estimator-production-runtime"
version = "0.1.0"
description = "Deployable dependency surface for the Energy-Aware Estimator"
requires-python = ">=3.11,<3.14"
dependencies = [
    "asyncpg>=0.29,<1",
    "fastapi>=0.139,<0.140",
    "langgraph>=1.2.9,<2",
    "langgraph-checkpoint-postgres>=3.1,<4",
    "litellm>=1.55,<2",
    "logfire[fastapi,httpx,psycopg]>=4.37,<5",
    "openai>=2.46,<3",
    "pgvector>=0.3,<1",
    "psycopg[binary,pool]>=3.3.4,<4",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.14,<3",
    "sqlalchemy>=2.0,<3",
    "structlog>=24.4,<27",
    "tiktoken>=0.7,<1",
    "uvicorn>=0.51,<0.52",
]

[tool.uv]
package = false
