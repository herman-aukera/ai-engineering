name: Session 13 Plus Diagnostics

on:
  push:
    branches:
      - gg-session-13/plus
  workflow_dispatch:

jobs:
  ruff-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ruff
        run: python -m pip install --quiet ruff==0.15.21

      - name: Capture Ruff diagnostics
        id: ruff
        continue-on-error: true
        run: |
          ruff check estimador-cag/app estimador-cag/tests --output-format concise > ruff-diagnostics.txt 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Ruff diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: session13-plus-ruff-diagnostics
          path: ruff-diagnostics.txt
          if-no-files-found: error

      - name: Fail when Ruff reported issues
        if: steps.ruff.outputs.exit_code != '0'
        run: exit 1
