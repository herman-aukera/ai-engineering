name: Final Project - Live RAG Proof

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Credentialed provider for bounded EACHAT answer calls
        required: true
        type: choice
        options:
          - openai
          - deepseek
          - kimi
        default: openai
      effort:
        description: EACHAT effort profile
        required: true
        type: choice
        options:
          - fast
          - balanced
          - max
        default: balanced
  workflow_call:
    inputs:
      provider:
        description: Credentialed provider for bounded EACHAT answer calls
        required: true
        type: string
      effort:
        description: EACHAT effort profile
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: final-project-live-rag-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-rag-proof:
    runs-on: ubuntu-latest
    environment: eachat-live-smoke
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: eachat
          POSTGRES_PASSWORD: eachat_test
          POSTGRES_DB: eachat_final_project
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eachat -d eachat_final_project"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      EXPECTED_HEAD_SHA: ${{ github.sha }}
      GIT_SHA: ${{ github.sha }}
      EACHAT_SUPPORT_RAG_ENABLED: "true"
      EACHAT_SUPPORT_RAG_DATABASE_URL: postgresql://eachat:eachat_test@localhost:5432/eachat_final_project
      EACHAT_SUPPORT_EMBEDDING_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EACHAT_SUPPORT_EMBEDDING_MODEL: text-embedding-3-small
      EACHAT_SUPPORT_EMBEDDING_DIMENSIONS: "1536"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
      MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
      LANGGRAPH_STRICT_MSGPACK: "true"
      EACHAT_ALLOW_IN_MEMORY: "true"
      PYTHONUNBUFFERED: "1"
      UV_HTTP_TIMEOUT: "300"
    defaults:
      run:
        working-directory: estimador-cag

    steps:
      - name: Checkout exact selected head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ env.EXPECTED_HEAD_SHA }}

      - name: Verify exact checked-out SHA
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.16"

      - name: Verify required embedding credential exists
        run: |
          test -n "$OPENAI_API_KEY" || { echo "Missing OPENAI_API_KEY in eachat-live-smoke"; exit 1; }
          test "$OPENAI_API_KEY" != "test" || { echo "OPENAI_API_KEY is a sentinel, not a live credential"; exit 1; }

      - name: Verify selected answer-provider credential exists
        env:
          SELECTED_PROVIDER: ${{ inputs.provider }}
        run: |
          python - <<'PY'
          import os

          provider = os.environ['SELECTED_PROVIDER']
          keys = {
              'openai': ('OPENAI_API_KEY',),
              'deepseek': ('DEEPSEEK_API_KEY',),
              'kimi': ('MOONSHOT_API_KEY', 'KIMI_API_KEY'),
          }[provider]
          values = [os.getenv(name, '').strip() for name in keys]
          assert any(value and value != 'test' for value in values), f'Missing live credential for {provider}'
          PY

      - name: Install frozen dependencies
        run: uv sync --frozen --extra dev

      - name: Ingest real allowlisted support corpus into pgvector
        run: uv run python scripts/ingest_eachat_support_rag.py > /tmp/final-project-ingestion.json

      - name: Validate live ingestion evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('/tmp/final-project-ingestion.json')
          report = json.loads(path.read_text(encoding='utf-8'))
          assert report['sources_ingested'] == 16, report
          assert report['active_chunks'] >= 16, report
          assert len(report['chunks_by_source']) == 16, report
          assert report['embedding_model'] == 'text-embedding-3-small', report
          assert report['vector_backend'] == 'postgresql_pgvector_hnsw', report
          PY

      - name: Evaluate persisted pgvector retrieval
        run: >-
          uv run python evals/energy_chat/final_project_eval.py
          --output /tmp/final-project-retrieval-report.json
          --k 5

      - name: Run bounded live RAG plus provider graph proof
        run: >-
          uv run python scripts/smoke_eachat_final_project_live.py
          --live
          --provider "${{ inputs.provider }}"
          --effort "${{ inputs.effort }}"
          --output /tmp/final-project-live-answer.json

      - name: Run full 11-case live golden-set evaluation
        run: >-
          uv run python evals/energy_chat/final_project_system_eval.py
          --live
          --provider "${{ inputs.provider }}"
          --effort "${{ inputs.effort }}"
          --strict
          --output /tmp/final-project-system-eval.json

      - name: Run full Compose restart-persistence proof
        run: >-
          uv run python scripts/smoke_eachat_final_project_compose.py
          --cleanup
          > /tmp/final-project-compose-smoke.json

      - name: Reject secrets from evidence artifacts
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          paths = [
              Path('/tmp/final-project-ingestion.json'),
              Path('/tmp/final-project-retrieval-report.json'),
              Path('/tmp/final-project-live-answer.json'),
              Path('/tmp/final-project-system-eval.json'),
              Path('/tmp/final-project-compose-smoke.json'),
          ]
          patterns = (
              r'sk-[A-Za-z0-9_-]{20,}',
              r'Bearer [A-Za-z0-9._-]{20,}',
              r'BEGIN (RSA|OPENSSH|PRIVATE) KEY',
          )
          for path in paths:
              text = path.read_text(encoding='utf-8')
              assert not any(re.search(pattern, text) for pattern in patterns), path
          PY

      - name: Upload sanitized final-project live evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: final-project-live-rag-${{ inputs.provider }}-${{ inputs.effort }}
          path: |
            /tmp/final-project-ingestion.json
            /tmp/final-project-retrieval-report.json
            /tmp/final-project-live-answer.json
            /tmp/final-project-system-eval.json
            /tmp/final-project-compose-smoke.json
          if-no-files-found: error
