name: Temporary supply-chain pin repair

on:
  push:
    branches: [EACHAT]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: EACHAT
          fetch-depth: 0
      - name: Pin external actions and add enforcement
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          pins = {
              'actions/checkout@v4': 'actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4',
              'actions/setup-python@v5': 'actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5',
              'astral-sh/setup-uv@v5': 'astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5',
              'actions/upload-artifact@v4': 'actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4',
              'actions/download-artifact@v4': 'actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4',
              'actions/github-script@v7': 'actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7',
              'docker/setup-buildx-action@v3': 'docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3',
              'docker/login-action@v3': 'docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3',
              'docker/build-push-action@v6': 'docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6',
              'devcontainers/ci@v0.3': 'devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3',
          }
          for path in sorted(Path('.github/workflows').glob('*.y*ml')):
              text = path.read_text(encoding='utf-8')
              for old, new in pins.items(): text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          guard = Path('.github/scripts/verify_action_pins.py'); guard.parent.mkdir(parents=True, exist_ok=True)
          guard.write_text('''from pathlib import Path\nimport re, sys\nSHA=re.compile(r"^[0-9a-f]{40}$"); USE=re.compile(r"^\\s*-?\\s*uses:\\s*([^#\\s]+)"); errors=[]\nfor path in sorted(Path(".github/workflows").glob("*.y*ml")):\n    for lineno,line in enumerate(path.read_text(encoding="utf-8").splitlines(),1):\n        m=USE.match(line)\n        if not m: continue\n        ref=m.group(1)\n        if ref.startswith("./"): continue\n        if "@" not in ref or not SHA.fullmatch(ref.rsplit("@",1)[1]): errors.append(f"{path}:{lineno}: mutable external action ref: {ref}")\nif errors: print("\\n".join(errors)); sys.exit(1)\nprint("GITHUB_ACTION_PINS_OK")\n''', encoding='utf-8')
          Path('.github/workflows/supply-chain-guard.yml').write_text('''name: Supply-chain guard\n\non:\n  push:\n  pull_request:\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\njobs:\n  immutable-actions:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Checkout exact validation ref\n        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4\n        with:\n          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}\n      - name: Reject mutable external action references\n        run: python .github/scripts/verify_action_pins.py\n''', encoding='utf-8')
          Path('.github/dependabot.yml').write_text('''version: 2\nupdates:\n  - package-ecosystem: github-actions\n    directory: /\n    schedule:\n      interval: weekly\n    open-pull-requests-limit: 5\n  - package-ecosystem: pip\n    directory: /estimador-cag\n    schedule:\n      interval: weekly\n    open-pull-requests-limit: 5\n  - package-ecosystem: docker\n    directory: /estimador-cag\n    schedule:\n      interval: weekly\n    open-pull-requests-limit: 5\n''', encoding='utf-8')
          subprocess.run(['python', str(guard)], check=True)
          PY
          git diff --check
      - name: Commit deterministic supply-chain repair
        run: |
          if [ -z "$(git status --porcelain)" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github
          git commit -m 'ci: pin external actions and enforce immutable refs'
          git push origin HEAD:EACHAT
