name: EACODE container image

on:
  push:
    branches: [EACODE, "gg-eacode/**"]
    paths:
      - "estimador-cag/**"
      - "docker-compose.yml"
      - ".github/workflows/eacode-image.yml"
  pull_request:
    paths:
      - "estimador-cag/**"
      - "docker-compose.yml"
      - ".github/workflows/eacode-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  runtime-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose --profile demo config --quiet

      - name: Start complete EACODE demo stack
        run: docker compose --profile demo up -d --build --wait db redis api

      - name: Prove API health, non-root runtime, and durable demo state
        run: |
          test "$(docker compose exec -T api id -u)" = "10001"
          docker compose exec -T api python -c "import importlib.util; assert importlib.util.find_spec('pytest') is None"
          curl --fail --silent --show-error http://127.0.0.1:8000/health
          curl --fail --silent --show-error http://127.0.0.1:8000/eacode/status
          curl --fail --silent --show-error http://127.0.0.1:8000/eacode/ui
          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            -d '{"proposal_id":"container-persistence-proof","objective":"Prove durable demo state","spec_id":"0012-production-hardening","patch":"def health():\n    return '\''todo'\''\n","changed_files":["app/health.py"],"proposed_commands":[["pytest","-q","tests/test_health.py"]]}' \
            http://127.0.0.1:8000/eacode/demo
          docker compose restart api
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --show-error \
            http://127.0.0.1:8000/eacode/demo/container-persistence-proof \
            | grep -q '"proposal_id":"container-persistence-proof"'

      - name: Prove isolated runner boundary
        run: |
          docker compose --profile demo build runner
          test "$(docker compose --profile demo run --rm --no-deps runner id -u)" = "10002"
          docker compose --profile demo run --rm --no-deps runner

      - name: Capture diagnostics
        if: always()
        run: docker compose --profile demo ps && docker compose --profile demo logs --no-color api

      - name: Stop stack
        if: always()
        run: docker compose --profile demo down --volumes --remove-orphans

  publish:
    if: github.event_name != 'pull_request'
    needs: runtime-proof
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: estimador-cag
          file: estimador-cag/Dockerfile
          target: runtime
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/eacode:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
