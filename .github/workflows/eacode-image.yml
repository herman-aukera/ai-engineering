name: EACODE container image

on:
  push:
    branches: [EACODE, "gg-eacode/**"]
    paths:
      - "estimador-cag/**"
      - ".github/workflows/eacode-image.yml"
  pull_request:
    paths:
      - "estimador-cag/**"
      - ".github/workflows/eacode-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: estimador-cag
          file: estimador-cag/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository_owner }}/eacode:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
