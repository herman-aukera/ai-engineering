name: Supply-chain contract

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  immutable-execution-chain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact validation ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact checked-out SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
      - name: Compile supply-chain validators
        run: python -m py_compile estimador-cag/scripts/verify_action_pins.py estimador-cag/scripts/verify_image_pins.py
      - name: Reject mutable GitHub Actions
        run: python estimador-cag/scripts/verify_action_pins.py
      - name: Reject mutable CI and production images
        run: python estimador-cag/scripts/verify_image_pins.py
