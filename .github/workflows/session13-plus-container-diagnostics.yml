name: Session 13 Plus container diagnostics

on:
  push:
    branches:
      - gg-session-13/plus-production-readiness
    paths:
      - .github/workflows/session13-plus-container-diagnostics.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: lidr
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lidr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Build and start exact image
        run: |
          docker build -t estimador-cag:${{ github.sha }} estimador-cag
          docker run --detach --name estimador-cag \
            --network host \
            --env DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/lidr \
            --env REDIS_URL=redis://127.0.0.1:6379/0 \
            --env DEEPSEEK_API_KEY=container-smoke-provider \
            --env KIMI_API_KEY=dummy \
            --env OPENAI_API_KEY=dummy \
            --env GRAPH_RETRIEVAL_MODE=parallel \
            --env GRAPH_RETRIEVAL_MAX_CONCURRENCY=4 \
            estimador-cag:${{ github.sha }}

      - name: Capture readiness evidence
        run: |
          mkdir -p /tmp/container-readiness
          for attempt in $(seq 1 40); do
            curl --silent --output /tmp/container-readiness/health.json http://127.0.0.1:8000/health || true
            curl --silent --output /tmp/container-readiness/ready.json http://127.0.0.1:8000/ready || true
            if python - <<'PY'
          import json
          from pathlib import Path
          try:
              health = json.loads(Path('/tmp/container-readiness/health.json').read_text())
              ready = json.loads(Path('/tmp/container-readiness/ready.json').read_text())
          except Exception:
              raise SystemExit(1)
          raise SystemExit(0 if health.get('status') == 'ok' and ready.get('ready') is True else 1)
          PY
            then
              break
            fi
            sleep 3
          done
          docker logs estimador-cag > /tmp/container-readiness/container.log 2>&1 || true
          docker inspect estimador-cag --format '{{json .State}}' > /tmp/container-readiness/container-state.json || true

      - name: Upload sanitized diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: container-readiness-diagnostics-${{ github.sha }}
          path: /tmp/container-readiness
          if-no-files-found: error
          retention-days: 7

      - name: Enforce readiness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          ready = json.loads(Path('/tmp/container-readiness/ready.json').read_text())
          assert ready['ready'] is True, ready
          PY
