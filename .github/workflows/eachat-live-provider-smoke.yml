name: EACHAT - Live Provider Smoke

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Credentialed provider to test
        required: true
        type: choice
        options:
          - deepseek
          - kimi
          - openai
        default: deepseek
      effort:
        description: Common effort profile
        required: true
        type: choice
        options:
          - fast
          - balanced
          - max
        default: balanced

permissions:
  contents: read

jobs:
  credentialed-one-call-smoke:
    runs-on: ubuntu-latest
    environment: eachat-live-smoke
    env:
      EXPECTED_HEAD_SHA: ${{ github.sha }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
      MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LANGGRAPH_STRICT_MSGPACK: "true"
      PYTHONUNBUFFERED: "1"
      UV_HTTP_TIMEOUT: "300"
    defaults:
      run:
        working-directory: estimador-cag
    steps:
      - name: Checkout selected exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ env.EXPECTED_HEAD_SHA }}

      - name: Verify exact checked-out SHA
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.16"

      - name: Install frozen application dependencies
        run: uv sync --frozen --extra dev

      - name: Run one bounded credentialed graph call
        run: >-
          uv run python scripts/smoke_eachat_live_provider.py
          --live
          --provider "${{ inputs.provider }}"
          --effort "${{ inputs.effort }}"
          --output /tmp/eachat-live-provider-smoke.json

      - name: Validate sanitized evidence contract
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          path = Path('/tmp/eachat-live-provider-smoke.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          allowed = {
              'status', 'provider', 'model', 'requested_provider', 'effort',
              'provider_call_count', 'input_tokens', 'output_tokens',
              'estimated_cost_usd', 'provider_latency_ms', 'fallback_used',
              'final_disposition', 'energy_decision', 'answer_present',
              'answer_body_recorded', 'prompt_body_recorded',
              'credential_recorded', 'checkpoint_id',
          }
          assert set(payload) == allowed
          assert payload['status'] == 'success'
          assert payload['provider_call_count'] == 1
          assert payload['fallback_used'] is False
          assert payload['answer_present'] is True
          assert payload['answer_body_recorded'] is False
          assert payload['prompt_body_recorded'] is False
          assert payload['credential_recorded'] is False
          serialized = path.read_text(encoding='utf-8')
          secret_patterns = (
              r'sk-[A-Za-z0-9_-]{20,}',
              r'Bearer [A-Za-z0-9._-]{20,}',
              r'BEGIN (RSA|OPENSSH|PRIVATE) KEY',
          )
          assert not any(re.search(pattern, serialized) for pattern in secret_patterns)
          PY

      - name: Upload sanitized live evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eachat-live-${{ inputs.provider }}-${{ inputs.effort }}
          path: /tmp/eachat-live-provider-smoke.json
          if-no-files-found: error
