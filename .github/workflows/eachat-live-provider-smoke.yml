name: EACHAT - Live Provider Smoke

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Credentialed provider to test
        required: true
        type: choice
        options:
          - deepseek
          - kimi
          - openai
        default: deepseek
      effort:
        description: Common effort profile
        required: true
        type: choice
        options:
          - fast
          - balanced
          - max
        default: balanced

permissions:
  contents: read

jobs:
  credentialed-one-call-smoke:
    runs-on: ubuntu-latest
    environment: eachat-live-smoke
    env:
      EXPECTED_HEAD_SHA: ${{ github.sha }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
      MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LANGGRAPH_STRICT_MSGPACK: "true"
      PYTHONUNBUFFERED: "1"
      UV_HTTP_TIMEOUT: "300"
    defaults:
      run:
        working-directory: estimador-cag
    steps:
      - name: Checkout selected exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.EXPECTED_HEAD_SHA }}

      - name: Verify exact checked-out SHA
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frozen application dependencies
        run: uv sync --frozen --extra dev

      - name: Run one bounded credentialed graph call
        run: >-
          uv run python scripts/smoke_eachat_live_provider.py
          --live
          --provider "${{ inputs.provider }}"
          --effort "${{ inputs.effort }}"
          --output /tmp/eachat-live-provider-smoke.json

      - name: Validate sanitized evidence contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('/tmp/eachat-live-provider-smoke.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          assert payload['status'] == 'success'
          assert payload['provider_call_count'] == 1
          assert payload['fallback_used'] is False
          assert payload['answer_body_recorded'] is False
          assert payload['prompt_body_recorded'] is False
          assert payload['credential_recorded'] is False
          forbidden = ('api_key', 'authorization', 'prompt', 'answer_body', 'response_body')
          serialized = path.read_text(encoding='utf-8').casefold()
          assert not any(token in serialized for token in forbidden)
          PY

      - name: Upload sanitized live evidence
        uses: actions/upload-artifact@v4
        with:
          name: eachat-live-${{ inputs.provider }}-${{ inputs.effort }}
          path: /tmp/eachat-live-provider-smoke.json
          if-no-files-found: error
