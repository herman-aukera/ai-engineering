name: Unified context supervisor one-shot wiring

on:
  push:
    branches:
      - gg-session-14/plus-consolidated

permissions:
  contents: write

jobs:
  wire-context-supervisor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout writable consolidation branch
        uses: actions/checkout@v4
        with:
          ref: gg-session-14/plus-consolidated
          fetch-depth: 0

      - name: Wire context-aware supervisor and remove this workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("estimador-cag/app/generation/graph/unified_build.py")
          text = path.read_text(encoding="utf-8")
          old_import = '''from app.generation.graph.nodes.unified_supervisor import (
              build_unified_supervisor_node,
          )'''.replace("              ", "    ")
          new_import = '''from app.generation.graph.nodes.unified_context_supervisor import (
              build_context_aware_unified_supervisor_node,
          )'''.replace("              ", "    ")
          old_call = '''            node=build_unified_supervisor_node(),'''
          new_call = '''            node=build_context_aware_unified_supervisor_node(
              context_detail=context_detail,
              repository_state=repository_state,
          ),'''.replace("              ", "    ")
          if old_import not in text:
              raise SystemExit("unified supervisor import was not found")
          if old_call not in text:
              raise SystemExit("unified supervisor node call was not found")
          text = text.replace(old_import, new_import, 1)
          text = text.replace(old_call, new_call, 1)
          path.write_text(text, encoding="utf-8")
          Path(".github/workflows/unified-context-one-shot.yml").unlink()
          PY

      - name: Commit context-aware wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estimador-cag/app/generation/graph/unified_build.py
          git add .github/workflows/unified-context-one-shot.yml
          git commit -m "consolidation: wire context-aware unified supervisor"
          git push origin HEAD:gg-session-14/plus-consolidated
