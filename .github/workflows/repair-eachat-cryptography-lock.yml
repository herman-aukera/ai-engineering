name: Repair EACHAT production lock

on:
  push:
    branches:
      - repair/eachat-cryptography-50
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: repair/eachat-cryptography-50
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate isolated production lock
        run: uv lock --project estimador-cag/deploy/eachat

      - name: Refresh lock digest
        working-directory: estimador-cag/deploy/eachat
        run: sha256sum uv.lock > uv.lock.sha256

      - name: Verify patched production dependency set
        run: |
          uv export --project estimador-cag/deploy/eachat --frozen --no-dev --format requirements-txt --output-file /tmp/eachat-production-requirements.txt
          uv tool run pip-audit --requirement /tmp/eachat-production-requirements.txt --progress-spinner off

      - name: Commit regenerated lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estimador-cag/deploy/eachat/uv.lock estimador-cag/deploy/eachat/uv.lock.sha256
          if git diff --cached --quiet; then
            echo "Production lock already current."
          else
            git commit -m "eachat: refresh production lock for cryptography 50"
            git push origin HEAD:repair/eachat-cryptography-50
          fi
