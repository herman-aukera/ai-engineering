name: Unified improvement repair one-shot

on:
  push:
    branches:
      - gg-session-14/plus-consolidated

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout writable consolidation branch
        uses: actions/checkout@v4
        with:
          ref: gg-session-14/plus-consolidated
          fetch-depth: 0

      - name: Repair authority, formatting and workflow hygiene
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("estimador-cag/app/generation/graph/unified_build.py")
          text = path.read_text(encoding="utf-8")

          old_imports = '''from app.generation.graph.nodes.unified_policy import (
              build_unified_policy_bootstrap_node,
          )
          from app.generation.graph.nodes.unified_context_supervisor import (
              build_context_aware_unified_supervisor_node,
          )
          '''.replace("          ", "")
          new_imports = '''from app.generation.graph.nodes.unified_context_supervisor import (
              build_context_aware_unified_supervisor_node,
          )
          from app.generation.graph.nodes.unified_policy import (
              build_unified_policy_bootstrap_node,
          )
          '''.replace("          ", "")
          if old_imports not in text:
              raise SystemExit("expected unified import block not found")
          text = text.replace(old_imports, new_imports, 1)

          old_gate = '''def _human_gate_to_proposal(base_gate):
              async def run_gate(
                  state: UnifiedEstimationGraphState,
              ) -> Command[Literal["proposal", "finalize"]]:
                  command = await base_gate(state)
                  raw_update = command.update
                  update = dict(raw_update) if isinstance(raw_update, Mapping) else {}
                  rejected = update.get("human_review_status") == "rejected"
                  return Command(
                      goto="finalize" if rejected else "proposal",
                      update={**update, "unified_phase": "human_review"},
                  )
          
              return run_gate
          '''.replace("          ", "")
          new_gate = '''def _human_gate_to_supervisor(base_gate):
              async def run_gate(
                  state: UnifiedEstimationGraphState,
              ) -> Command[Literal["supervisor"]]:
                  command = await base_gate(state)
                  raw_update = command.update
                  update = dict(raw_update) if isinstance(raw_update, Mapping) else {}
                  return Command(
                      goto="supervisor",
                      update={**update, "unified_phase": "human_review"},
                  )
          
              return run_gate
          '''.replace("          ", "")
          if old_gate not in text:
              raise SystemExit("expected direct human route adapter not found")
          text = text.replace(old_gate, new_gate, 1)
          text = text.replace(
              "node=_human_gate_to_proposal(context_aware_gate),",
              "node=_human_gate_to_supervisor(context_aware_gate),",
              1,
          )

          old_supervisor = '''            node=build_context_aware_unified_supervisor_node(
              context_detail=context_detail,
              repository_state=repository_state,
          ),
          '''
          new_supervisor = '''            node=build_context_aware_unified_supervisor_node(
                  context_detail=context_detail,
                  repository_state=repository_state,
              ),
          '''
          if old_supervisor not in text:
              raise SystemExit("expected malformed supervisor builder block not found")
          text = text.replace(old_supervisor, new_supervisor, 1)
          path.write_text(text, encoding="utf-8")

          for workflow in (
              Path(".github/workflows/unified-final-handoff-one-shot.yml"),
              Path(".github/workflows/unified-improvement-repair-one-shot.yml"),
          ):
              if workflow.exists():
                  workflow.unlink()
          PY

      - name: Commit repaired consolidation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estimador-cag/app/generation/graph/unified_build.py
          git add .github/workflows/unified-final-handoff-one-shot.yml
          git add .github/workflows/unified-improvement-repair-one-shot.yml
          git commit -m "consolidation: restore supervisor authority and remove one-shot workflows"
          git push origin HEAD:gg-session-14/plus-consolidated

# retrigger after workflow registration
