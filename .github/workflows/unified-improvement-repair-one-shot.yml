name: Unified improvement repair one-shot

on:
  push:
    branches:
      - gg-session-14/plus-consolidated
  pull_request:
    branches:
      - gg-session-14/plus
    types:
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout writable consolidation branch
        uses: actions/checkout@v4
        with:
          ref: gg-session-14/plus-consolidated
          fetch-depth: 0

      - name: Install matching Ruff
        uses: astral-sh/setup-uv@v5

      - name: Repair authority and workflow hygiene
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("estimador-cag/app/generation/graph/unified_build.py")
          text = path.read_text(encoding="utf-8")

          import_pattern = re.compile(
              r"(from app\.generation\.graph\.nodes\.unified_policy import \(\n"
              r"    build_unified_policy_bootstrap_node,\n\)\n)"
              r"(from app\.generation\.graph\.nodes\.unified_context_supervisor import \(\n"
              r"    build_context_aware_unified_supervisor_node,\n\)\n)"
          )
          text, import_count = import_pattern.subn(r"\2\1", text, count=1)
          if import_count != 1:
              raise SystemExit(
                  f"expected one unsorted unified import pair, found {import_count}"
              )

          gate_pattern = re.compile(
              r"def _human_gate_to_proposal\(base_gate\):\n"
              r".*?\n    return run_gate\n",
              flags=re.DOTALL,
          )
          new_gate = '''def _human_gate_to_supervisor(base_gate):
              async def run_gate(
                  state: UnifiedEstimationGraphState,
              ) -> Command[Literal["supervisor"]]:
                  command = await base_gate(state)
                  raw_update = command.update
                  update = (
                      dict(raw_update)
                      if isinstance(raw_update, Mapping)
                      else {}
                  )
                  return Command(
                      goto="supervisor",
                      update={**update, "unified_phase": "human_review"},
                  )
          
              return run_gate
          '''.replace("          ", "")
          text, gate_count = gate_pattern.subn(new_gate, text, count=1)
          if gate_count != 1:
              raise SystemExit(
                  f"expected one direct human route adapter, found {gate_count}"
              )

          call_old = "node=_human_gate_to_proposal(context_aware_gate),"
          call_new = "node=_human_gate_to_supervisor(context_aware_gate),"
          if text.count(call_old) != 1:
              raise SystemExit(
                  "expected one direct human gate call site"
              )
          text = text.replace(call_old, call_new, 1)
          path.write_text(text, encoding="utf-8")

          for workflow in (
              Path(".github/workflows/unified-final-handoff-one-shot.yml"),
              Path(".github/workflows/unified-improvement-repair-one-shot.yml"),
          ):
              if workflow.exists():
                  workflow.unlink()
          PY

      - name: Normalize repaired module
        run: |
          uvx --from ruff==0.15.12 ruff check --fix estimador-cag/app/generation/graph/unified_build.py
          uvx --from ruff==0.15.12 ruff format estimador-cag/app/generation/graph/unified_build.py
          uvx --from ruff==0.15.12 ruff check estimador-cag/app/generation/graph/unified_build.py

      - name: Commit repaired consolidation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estimador-cag/app/generation/graph/unified_build.py
          git add .github/workflows/unified-final-handoff-one-shot.yml
          git add .github/workflows/unified-improvement-repair-one-shot.yml
          git commit -m "consolidation: restore supervisor authority and remove one-shot workflows"
          git push origin HEAD:gg-session-14/plus-consolidated
