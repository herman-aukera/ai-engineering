name: Session 13 Plus production container

on:
  push:
    branches:
      - gg-session-13/plus-production-readiness
    paths:
      - estimador-cag/Dockerfile
      - estimador-cag/.dockerignore
      - estimador-cag/app/**
      - estimador-cag/pyproject.toml
      - estimador-cag/uv.lock
      - .github/workflows/session13-plus-production-container.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: lidr
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lidr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout exact readiness head
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build -t estimador-cag:${{ github.sha }} estimador-cag

      - name: Run production image
        run: |
          docker run --detach --name estimador-cag \
            --network host \
            --env DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/lidr \
            --env REDIS_URL=redis://127.0.0.1:6379/0 \
            --env DEEPSEEK_API_KEY=container-smoke-provider \
            --env KIMI_API_KEY=dummy \
            --env OPENAI_API_KEY=dummy \
            --env GRAPH_RETRIEVAL_MODE=parallel \
            --env GRAPH_RETRIEVAL_MAX_CONCURRENCY=4 \
            estimador-cag:${{ github.sha }}

      - name: Wait for liveness and readiness
        run: |
          for attempt in $(seq 1 40); do
            health_code=$(curl --silent --output /tmp/health.json --write-out '%{http_code}' http://127.0.0.1:8000/health || true)
            ready_code=$(curl --silent --output /tmp/ready.json --write-out '%{http_code}' http://127.0.0.1:8000/ready || true)
            if [ "$health_code" = "200" ] && [ "$ready_code" = "200" ]; then
              cat /tmp/health.json
              cat /tmp/ready.json
              break
            fi
            if [ "$attempt" = "40" ]; then
              echo "Container failed readiness gate"
              cat /tmp/health.json 2>/dev/null || true
              cat /tmp/ready.json 2>/dev/null || true
              docker logs estimador-cag
              false
            fi
            sleep 3
          done

      - name: Verify no secret-bearing readiness fields
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/ready.json').read_text())
          serialized = json.dumps(payload).lower()
          assert payload['ready'] is True
          assert payload['status'] == 'ready'
          assert payload['configured_providers'] == ['deepseek']
          assert 'container-smoke-provider' not in serialized
          assert 'database_url' not in serialized
          assert 'redis_url' not in serialized
          PY

      - name: Show container logs on failure
        if: failure()
        run: docker logs estimador-cag || true
