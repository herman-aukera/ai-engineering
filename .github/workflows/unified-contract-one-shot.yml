name: Unified contract one-shot correction

on:
  push:
    branches:
      - gg-session-14/plus-consolidated

permissions:
  contents: write

jobs:
  correct-contract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout writable consolidation branch
        uses: actions/checkout@v4
        with:
          ref: gg-session-14/plus-consolidated
          fetch-depth: 0

      - name: Correct plain-dict contract assertion and remove this workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("estimador-cag/tests/test_session13_14_unified_contract.py")
          text = path.read_text(encoding="utf-8")
          old = '''    state.update(command.update)
              state["unified_proposal_completed"] = True
              command = await supervisor(state)
              assert command.goto == "finalize"
              assert command.update["routing_steps"] == len(
                  state["unified_route_events"]
              ) + 1
          '''.replace("              ", "    ")
          new = '''    state.update(command.update)
              state["unified_proposal_completed"] = True
              previous_routing_steps = state["routing_steps"]
              command = await supervisor(state)
              assert command.goto == "finalize"
              assert command.update["routing_steps"] == previous_routing_steps + 1
          '''.replace("              ", "    ")
          if old not in text:
              raise SystemExit("expected contract assertion block was not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          Path(".github/workflows/unified-contract-one-shot.yml").unlink()
          PY

      - name: Commit corrected contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estimador-cag/tests/test_session13_14_unified_contract.py
          git add .github/workflows/unified-contract-one-shot.yml
          git commit -m "consolidation: align contract test with routing counter"
          git push origin HEAD:gg-session-14/plus-consolidated
