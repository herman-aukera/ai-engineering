name: One-shot cleanup unintended branch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-unintended-dummy-branch.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Delete unintended dummy branch
        run: git push origin --delete dummy

      - name: Remove one-shot workflow from main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-unintended-dummy-branch.yml
          git commit -m "main: chore(ci): remove one-shot branch cleanup workflow"
          git push origin HEAD:main
