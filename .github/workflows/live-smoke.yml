name: Live provider smoke - Estimador CAG

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: estimador-cag
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Verify live secrets exist
        run: |
          test -n "$DEEPSEEK_API_KEY" || (echo "DEEPSEEK_API_KEY is missing" && exit 1)
          test -n "$KIMI_API_KEY" || (echo "KIMI_API_KEY is missing" && exit 1)

      - name: Start FastAPI
        run: |
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/estimador-cag.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf -X POST http://127.0.0.1:8000/sessions >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/estimador-cag.log
          exit 1

      - name: Run bounded live stress smoke
        run: |
          uv run python -m evals.stress.run \
            --http http://127.0.0.1:8000 \
            --scenarios growing,pivot,contradiction \
            --attachment-sizes 0,5,20,50,100 \
            --repeats 3 \
            --turn-count 2 \
            --output evals/stress/live_smoke/results.csv

          wc -l evals/stress/live_smoke/results.csv
          sed -n '1,180p' evals/stress/live_smoke/REPORT.md

      - name: Upload live smoke artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-smoke-results
          path: |
            estimador-cag/evals/stress/live_smoke/results.csv
            estimador-cag/evals/stress/live_smoke/REPORT.md
