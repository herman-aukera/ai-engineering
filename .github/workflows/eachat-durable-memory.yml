name: EACHAT - Durable Memory

on:
  pull_request:
    paths:
      - estimador-cag/app/energy_chat/**
      - estimador-cag/tests/test_energy_chat_postgres_runtime.py
      - estimador-cag/tests/test_energy_chat_postgres_conversations.py
      - estimador-cag/deploy/eachat/**
      - .github/workflows/eachat-durable-memory.yml
  push:
    branches:
      - EACHAT
      - repair/eachat-foundation-and-release-evidence
    paths:
      - estimador-cag/app/energy_chat/**
      - estimador-cag/tests/test_energy_chat_postgres_runtime.py
      - estimador-cag/tests/test_energy_chat_postgres_conversations.py
      - estimador-cag/deploy/eachat/**
      - .github/workflows/eachat-durable-memory.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  encrypted-postgres-memory:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:e17e86066e5ef83e0952a9347f5c792b7ece00972e2aa787a6986f471b3dd3d5
        env:
          POSTGRES_USER: eachat
          POSTGRES_PASSWORD: eachat_test
          POSTGRES_DB: eachat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eachat -d eachat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EACHAT_POSTGRES_URL: postgresql://eachat:eachat_test@localhost:5432/eachat_test
      LANGGRAPH_STRICT_MSGPACK: "true"
      OPENAI_API_KEY: test
      DEEPSEEK_API_KEY: test
      KIMI_API_KEY: test
      PYTHONUNBUFFERED: "1"
      UV_HTTP_TIMEOUT: "300"
    defaults:
      run:
        working-directory: estimador-cag
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ env.EXPECTED_HEAD_SHA }}

      - name: Verify exact checked-out SHA
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install deterministic test environment
        run: uv sync --frozen --extra dev --extra postgres

      - name: Verify isolated production lock
        run: |
          uv lock --project deploy/eachat
          cd deploy/eachat
          sha256sum --check uv.lock.sha256

      - name: Install exact production dependencies into test environment
        run: |
          uv export --project deploy/eachat --frozen --no-dev --format requirements-txt --output-file /tmp/eachat-production-requirements.txt
          uv pip install --python .venv/bin/python --requirement /tmp/eachat-production-requirements.txt

      - name: Run checkpoint and encrypted conversation restart proofs
        run: |
          uv run pytest -q \
            tests/test_energy_chat_postgres_runtime.py \
            tests/test_energy_chat_postgres_conversations.py \
            2>&1 | tee /tmp/eachat-memory-pytest.txt

      - name: Upload durable-memory evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eachat-durable-memory-evidence
          path: |
            /tmp/eachat-production-requirements.txt
            /tmp/eachat-memory-pytest.txt
          if-no-files-found: warn
