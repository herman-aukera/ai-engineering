name: Energy-Aware Portfolio Final Gate

on:
  push:
    branches: [main]
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portfolio-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      main_sha: ${{ steps.heads.outputs.main_sha }}
      eachat_sha: ${{ steps.heads.outputs.eachat_sha }}
      eacode_sha: ${{ steps.heads.outputs.eacode_sha }}
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          path: portfolio/main
          fetch-depth: 1
      - name: Checkout canonical EACHAT
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: EACHAT
          path: portfolio/eachat
          fetch-depth: 1
      - name: Checkout canonical EACODE
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: EACODE
          path: portfolio/eacode
          fetch-depth: 1
      - name: Capture exact canonical heads
        id: heads
        run: |
          MAIN_SHA="$(git -C portfolio/main rev-parse HEAD)"
          EACHAT_SHA="$(git -C portfolio/eachat rev-parse HEAD)"
          EACODE_SHA="$(git -C portfolio/eacode rev-parse HEAD)"
          mkdir -p portfolio/evidence
          {
            printf 'main=%s\n' "$MAIN_SHA"
            printf 'EACHAT=%s\n' "$EACHAT_SHA"
            printf 'EACODE=%s\n' "$EACODE_SHA"
          } | tee portfolio/evidence/canonical-heads.txt
          printf 'main_sha=%s\n' "$MAIN_SHA" >> "$GITHUB_OUTPUT"
          printf 'eachat_sha=%s\n' "$EACHAT_SHA" >> "$GITHUB_OUTPUT"
          printf 'eacode_sha=%s\n' "$EACODE_SHA" >> "$GITHUB_OUTPUT"
      - name: Verify immutable execution chain on all products
        run: |
          for root in portfolio/main portfolio/eachat portfolio/eacode; do
            python "$root/estimador-cag/scripts/verify_action_pins.py"
            python "$root/estimador-cag/scripts/verify_image_pins.py"
            python "$root/estimador-cag/scripts/verify_tool_pins.py"
            python "$root/estimador-cag/scripts/verify_dependabot_config.py"
          done
      - name: Validate exhaustive zero-gap requirements matrix
        run: |
          python portfolio/main/estimador-cag/scripts/verify_portfolio_requirements.py \
            --rtm portfolio/main/docs/portfolio_requirements_traceability.json \
            --repo main=portfolio/main \
            --repo EACHAT=portfolio/eachat \
            --repo EACODE=portfolio/eacode \
            | tee portfolio/evidence/portfolio-rtm.txt
      - name: Run portfolio protocol, documentation and split evaluation
        run: |
          python portfolio/main/estimador-cag/scripts/portfolio_evaluation.py \
            portfolio/main/estimador-cag \
            portfolio/eachat/estimador-cag \
            portfolio/eacode/estimador-cag \
            --output portfolio/evidence/portfolio-evaluation.json
      - name: Verify canonical branch set declared by products
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          expected = {
              'main': 'estimator',
              'EACHAT': 'eachat',
              'EACODE': 'eacode',
          }
          roots = {
              'main': Path('portfolio/main/estimador-cag'),
              'EACHAT': Path('portfolio/eachat/estimador-cag'),
              'EACODE': Path('portfolio/eacode/estimador-cag'),
          }
          for branch, root in roots.items():
              manifest = json.loads((root / 'docs/energy_aware_product_manifest.json').read_text())
              assert manifest['canonical_branch'] == branch
              assert manifest['product'] == expected[branch]
              assert manifest.get('forbidden_peer_imports')
          PY
      - name: Upload portfolio evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: energy-aware-portfolio-final-${{ github.run_id }}
          path: portfolio/evidence
          if-no-files-found: error
          retention-days: 30

  deterministic-product-gates:
    name: deterministic-${{ matrix.product }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - product: estimator
            ref: main
            smoke: tests/smoke/test_session15_http_smoke.py
            contract: scripts/session15_production_contract.py
            exporter: scripts/estimator_export_production_requirements.py
            requirements: deploy/estimator/requirements.generated.txt
            dockerfile: Dockerfile
          - product: eachat
            ref: EACHAT
            smoke: tests/smoke/test_eachat_production_smoke.py
            contract: scripts/session15_eachat_production_contract.py
            exporter: scripts/eachat_export_production_requirements.py
            requirements: deploy/eachat/requirements.generated.txt
            dockerfile: deploy/eachat/Dockerfile
          - product: eacode
            ref: EACODE
            smoke: tests/smoke/test_eacode_production_smoke.py
            contract: scripts/session15_eacode_production_contract.py
            exporter: scripts/eacode_export_production_requirements.py
            requirements: deploy/eacode/requirements.generated.txt
            dockerfile: deploy/eacode/Dockerfile
    env:
      OPENAI_API_KEY: test
      DEEPSEEK_API_KEY: test
      KIMI_API_KEY: test
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout canonical product head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
      - name: Capture exact product SHA
        run: |
          printf '%s=%s\n' '${{ matrix.ref }}' "$(git rev-parse HEAD)" | tee /tmp/product-head.txt
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Set up Python 3.11.16
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.16"
      - name: Install deterministic development environment
        working-directory: estimador-cag
        run: uv sync --frozen --extra dev
      - name: Ruff
        working-directory: estimador-cag
        run: |
          TARGETS="app tests scripts"
          test -d evals && TARGETS="$TARGETS evals"
          test -d energy_core && TARGETS="$TARGETS energy_core"
          uv run ruff check $TARGETS
      - name: Compile first-party Python
        working-directory: estimador-cag
        run: |
          uv run python -m py_compile $(find app tests scripts evals energy_core -name '*.py' -type f 2>/dev/null)
      - name: Immutable Action validation
        working-directory: estimador-cag
        run: uv run python scripts/verify_action_pins.py
      - name: Immutable executable image validation
        working-directory: estimador-cag
        run: uv run python scripts/verify_image_pins.py
      - name: Immutable executable tool validation
        working-directory: estimador-cag
        run: uv run python scripts/verify_tool_pins.py
      - name: Dependabot policy validation
        working-directory: estimador-cag
        run: uv run python scripts/verify_dependabot_config.py
      - name: Full deterministic suite
        working-directory: estimador-cag
        run: uv run pytest -q -m "not live_provider"
      - name: Focused production smoke
        working-directory: estimador-cag
        run: uv run pytest -q '${{ matrix.smoke }}'
      - name: Production contract
        working-directory: estimador-cag
        run: uv run python '${{ matrix.contract }}'
      - name: Verify isolated production dependency closure
        working-directory: estimador-cag
        run: uv run python '${{ matrix.exporter }}'
      - name: Audit isolated production dependencies
        working-directory: estimador-cag
        run: uvx --from pip-audit==2.10.1 pip-audit --requirement '${{ matrix.requirements }}'
      - name: Energy-Aware protocol conformance
        working-directory: estimador-cag
        run: uv run python scripts/verify_energy_aware_protocol.py
      - name: Documentation truth
        working-directory: estimador-cag
        run: uv run python scripts/verify_documentation_truth.py
      - name: Product-only split dry run
        working-directory: estimador-cag
        run: uv run python scripts/product_split_dry_run.py
      - name: Build production image from product-specific lock
        working-directory: estimador-cag
        run: docker build --file '${{ matrix.dockerfile }}' --tag 'ea-${{ matrix.product }}:${{ github.run_id }}' .
      - name: Verify production image is non-root
        run: test "$(docker run --rm --entrypoint id 'ea-${{ matrix.product }}:${{ github.run_id }}' -u)" != "0"
      - name: Diff and tracked-secret gates
        run: |
          git diff --check
          matches="$(git grep -n -E 'sk-[A-Za-z0-9_-]{20,}|Bearer [A-Za-z0-9._-]{20,}|BEGIN (RSA|OPENSSH|PRIVATE) KEY' -- . ':!*.lock' || true)"
          unapproved="$(printf '%s\n' "$matches" | grep -v '# test-secret-fixture' || true)"
          if [ -n "$unapproved" ]; then
            printf '%s\n' "$unapproved" | cut -d: -f1-2
            false
          fi
      - name: Verify validation did not mutate tracked source
        run: test -z "$(git status --short)"
      - name: Upload exact-head marker
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: final-head-${{ matrix.product }}-${{ github.run_id }}
          path: /tmp/product-head.txt
          if-no-files-found: error
          retention-days: 30

  report-final-gate:
    if: ${{ always() }}
    needs:
      - portfolio-contracts
      - deterministic-product-gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Report exact hosted result to visibility PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PORTFOLIO_RESULT: ${{ needs.portfolio-contracts.result }}
          PRODUCT_RESULT: ${{ needs.deterministic-product-gates.result }}
          MAIN_SHA: ${{ needs.portfolio-contracts.outputs.main_sha }}
          EACHAT_SHA: ${{ needs.portfolio-contracts.outputs.eachat_sha }}
          EACODE_SHA: ${{ needs.portfolio-contracts.outputs.eacode_sha }}
        with:
          script: |
            const marker = '<!-- energy-aware-portfolio-final-gate -->';
            const portfolio = process.env.PORTFOLIO_RESULT || 'unknown';
            const products = process.env.PRODUCT_RESULT || 'unknown';
            const green = portfolio === 'success' && products === 'success';
            const verdict = green ? 'GREEN' : 'RED';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\n## Energy-Aware Portfolio Final Gate — ${verdict}\n\n` +
              `- event: \`${context.eventName}\`\n` +
              `- run: ${runUrl}\n` +
              `- run id: \`${context.runId}\`\n` +
              `- portfolio contracts: **${portfolio}**\n` +
              `- deterministic product gates: **${products}**\n` +
              `- main: \`${process.env.MAIN_SHA || 'unavailable'}\`\n` +
              `- EACHAT: \`${process.env.EACHAT_SHA || 'unavailable'}\`\n` +
              `- EACODE: \`${process.env.EACODE_SHA || 'unavailable'}\`\n` +
              `- zero-gap RTM: **required**\n` +
              `- immutable Actions/images/tools: **required**\n\n` +
              `This comment is emitted by the cross-product final gate; provider-live calls are not part of this blocking validation.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number || 29;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
