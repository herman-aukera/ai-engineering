name: CI - Estimador CAG

on:
  push:
    branches:
      - main
      - "gg-**"
      - "sesion-**"
      - "session**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-estimador-cag:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: estimador-cag
    env:
      OPENAI_API_KEY: test
      DEEPSEEK_API_KEY: test
      KIMI_API_KEY: test
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply semantic-only diff cleanup
        if: (github.ref == 'refs/heads/gg-session-13/plus-stabilization' || github.head_ref == 'gg-session-13/plus-stabilization') && hashFiles('scripts/session13_plus_diff_cleanup.py') != ''
        working-directory: .
        run: python scripts/session13_plus_diff_cleanup.py

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Ruff
        run: |
          TARGETS="app tests"
          test -f streamlit_app.py && TARGETS="$TARGETS streamlit_app.py"
          test -d evals && TARGETS="$TARGETS evals"
          uv run ruff check $TARGETS

      - name: Compile Python
        run: uv run python -m py_compile $(find app tests evals -name '*.py' -type f 2>/dev/null)

      - name: Deterministic tests
        run: uv run pytest -q -m "not live_provider"

      - name: Diff and secret gates
        working-directory: .
        run: |
          git diff --check
          if git diff | grep -E 'sk-[A-Za-z0-9_-]{20,}|BEGIN (RSA|OPENSSH|PRIVATE) KEY'; then
            echo "Potential secret in cleanup diff"
            false
          fi

      - name: Commit validated semantic cleanup
        if: github.event_name == 'push' && github.ref == 'refs/heads/gg-session-13/plus-stabilization' && hashFiles('scripts/session13_plus_diff_cleanup.py') != ''
        working-directory: .
        run: |
          rm -f scripts/session13_plus_diff_cleanup.py
          git config user.name "GPT-5.6 Stabilization"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git commit -m "session13: chore(plus): reduce stabilization diff noise"
          git push origin HEAD:gg-session-13/plus-stabilization
