name: CI - Estimador CAG

on:
  push:
    branches:
      - main
      - "gg-*"
      - "sesion-*"
      - "session*"
  pull_request:
  workflow_dispatch:

jobs:
  test-estimador-cag:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: estimador-cag
    env:
      DEEPSEEK_API_KEY: test
      KIMI_API_KEY: test
      STRESS_FAKE_PROVIDER: "true"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff
        run: >
          uv run ruff check
          app
          evals
          tests/test_stress_metrics.py
          tests/test_stress_scenarios.py
          tests/test_stress_pdf_fixtures.py
          tests/test_session06_turn_observed.py

      - name: Compile Python
        run: uv run python -m py_compile $(find app evals tests -name '*.py' -type f)

      - name: Tests
        run: uv run pytest -q
