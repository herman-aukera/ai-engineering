name: CI - Estimador CAG

on:
  push:
    branches:
      - main
      - "gg-**"
      - "sesion-**"
      - "session**"
      - gg-session-14/plus-consolidated
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-estimador-cag:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: estimador-cag
    env:
      OPENAI_API_KEY: test
      DEEPSEEK_API_KEY: test
      KIMI_API_KEY: test
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout exact validation ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact checked-out SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.16"
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Ruff
        run: |
          TARGETS="app tests scripts"
          test -f streamlit_app.py && TARGETS="$TARGETS streamlit_app.py"
          test -d evals && TARGETS="$TARGETS evals"
          uv run ruff check $TARGETS
      - name: Compile Python
        run: uv run python -m py_compile $(find app tests evals scripts -name '*.py' -type f 2>/dev/null)
      - name: Deterministic unit and contract tests
        run: uv run pytest -q -m "not live_provider"
      - name: Keyless HTTP smoke tests
        run: uv run pytest -q tests/smoke/test_session15_http_smoke.py
      - name: Session 15 production contract
        run: uv run python scripts/session15_production_contract.py
      - name: Diff and secret gates
        working-directory: .
        run: |
          git diff --check
          matches="$(git grep -n -E 'sk-[A-Za-z0-9_-]{20,}|Bearer [A-Za-z0-9._-]{20,}|BEGIN (RSA|OPENSSH|PRIVATE) KEY' -- . ':!*.lock' || true)"
          unapproved="$(printf '%s\n' "$matches" | grep -v '# test-secret-fixture' || true)"
          if [ -n "$unapproved" ]; then
            echo "Potential secret in tracked files"
            printf '%s\n' "$unapproved" | cut -d: -f1-2
            false
          fi

  unified-postgres-evidence:
    if: >-
      (github.event_name == 'pull_request' && github.head_ref == 'gg-session-14/plus-consolidated') ||
      (github.event_name == 'push' &&
       (github.ref_name == 'gg-session-14/plus-consolidated' || github.ref_name == 'main')) ||
      github.event_name == 'workflow_dispatch'
    needs: test-estimador-cag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_DB: lidr
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lidr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: estimador-cag
    env:
      RUN_SESSION14_POSTGRES_INTEGRATION: "1"
      SESSION14_POSTGRES_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lidr
      SESSION14_POSTGRES_EVIDENCE_PATH: artifacts/session14/postgres_pause_resume_tdd.json
      SESSION13_14_UNIFIED_POSTGRES_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lidr
      SESSION13_14_UNIFIED_POSTGRES_EVIDENCE_PATH: artifacts/session13_14_unified/postgres_pause_resume.json
      OPENAI_API_KEY: test
      DEEPSEEK_API_KEY: test
      KIMI_API_KEY: test
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout exact unified head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact checked-out SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.16"
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Session 14 PostgreSQL integration test
        run: uv run pytest -q tests/integration/test_session14_postgres_human_review.py
      - name: Capture unified PostgreSQL lifecycle
        run: GITHUB_SHA=${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }} uv run python -m scripts.session13_14_unified_postgres_evidence
      - name: Upload PostgreSQL integration evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: session13-14-postgres-integration-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: |
            estimador-cag/artifacts/session14/postgres_pause_resume_tdd.json
            estimador-cag/artifacts/session13_14_unified/postgres_pause_resume.json
          if-no-files-found: error
          retention-days: 30

  container-readiness:
    if: >-
      (github.event_name == 'pull_request' &&
       ((github.base_ref == 'main' && github.head_ref == 'gg-session-13/plus') ||
        github.head_ref == 'gg-session-14/plus-consolidated')) ||
      (github.event_name == 'push' &&
       (github.ref_name == 'gg-session-14/plus-consolidated' || github.ref_name == 'main')) ||
      github.event_name == 'workflow_dispatch'
    needs: test-estimador-cag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_DB: lidr
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lidr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 0
      - name: Verify exact checked-out SHA
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - name: Generate masked estimator identity key
        run: |
          SESSION_KEY=$(python -c "import secrets; print(secrets.token_urlsafe(48))")
          echo "::add-mask::$SESSION_KEY"
          printf 'ESTIMATOR_SESSION_SIGNING_KEY=%s\n' "$SESSION_KEY" >> "$GITHUB_ENV"
      - name: Build production image
        run: docker build -t estimador-cag:$EXPECTED_HEAD_SHA estimador-cag
      - name: Run production image
        run: |
          docker run --detach --name estimador-cag \
            --network host \
            --env GIT_SHA="$EXPECTED_HEAD_SHA" \
            --env DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/lidr \
            --env REDIS_URL=redis://127.0.0.1:6379/0 \
            --env ESTIMATOR_SESSION_SIGNING_KEY="$ESTIMATOR_SESSION_SIGNING_KEY" \
            --env DEEPSEEK_API_KEY=container-smoke-provider \
            --env KIMI_API_KEY=dummy \
            --env OPENAI_API_KEY=dummy \
            --env GRAPH_RETRIEVAL_MODE=parallel \
            --env GRAPH_RETRIEVAL_MAX_CONCURRENCY=4 \
            estimador-cag:$EXPECTED_HEAD_SHA
      - name: Probe startup liveness readiness version and authenticated unified contract
        run: |
          mkdir -p /tmp/container-readiness
          ready=false
          startup_code=000
          health_code=000
          ready_code=000
          version_code=000
          unified_code=000
          unauthenticated_unified_code=000
          for attempt in $(seq 1 40); do
            startup_code=$(curl --silent --connect-timeout 1 --max-time 2 --output /tmp/container-readiness/startup.json --write-out '%{http_code}' http://127.0.0.1:8000/startup || true)
            health_code=$(curl --silent --connect-timeout 1 --max-time 2 --output /tmp/container-readiness/health.json --write-out '%{http_code}' http://127.0.0.1:8000/health || true)
            ready_code=$(curl --silent --connect-timeout 1 --max-time 2 --output /tmp/container-readiness/ready.json --write-out '%{http_code}' http://127.0.0.1:8000/ready || true)
            version_code=$(curl --silent --connect-timeout 1 --max-time 2 --output /tmp/container-readiness/version.json --write-out '%{http_code}' http://127.0.0.1:8000/version || true)
            if [ "$startup_code" = "200" ] && [ "$health_code" = "200" ] && [ "$ready_code" = "200" ] && [ "$version_code" = "200" ]; then
              ready=true
              break
            fi
            sleep 3
          done
          if [ "$ready" = "true" ]; then
            TOKEN=$(docker exec estimador-cag python -c "import os; from datetime import UTC,datetime,timedelta; from app.estimator.identity import SignedSessionCodec; print(SignedSessionCodec(os.environ['ESTIMATOR_SESSION_SIGNING_KEY'].encode()).issue(subject='ci', tenant_id='ci', roles=('member',), expires_at=datetime.now(UTC)+timedelta(minutes=10)))")
            unauthenticated_unified_code=$(curl --silent --connect-timeout 1 --max-time 2 --output /tmp/container-readiness/unified-unauthenticated.json --write-out '%{http_code}' http://127.0.0.1:8000/api/v1/estimate/graph/unified/readiness || true)
            unified_code=$(curl --silent --connect-timeout 1 --max-time 2 --header "Authorization: Bearer $TOKEN" --output /tmp/container-readiness/unified-ready.json --write-out '%{http_code}' http://127.0.0.1:8000/api/v1/estimate/graph/unified/readiness || true)
          fi
          docker logs estimador-cag > /tmp/container-readiness/container.log 2>&1 || true
          docker inspect estimador-cag --format '{{json .State}}' > /tmp/container-readiness/container-state.json || true
          printf '%s\n' "$startup_code" > /tmp/container-readiness/startup-status.txt
          printf '%s\n' "$health_code" > /tmp/container-readiness/health-status.txt
          printf '%s\n' "$ready_code" > /tmp/container-readiness/ready-status.txt
          printf '%s\n' "$version_code" > /tmp/container-readiness/version-status.txt
          printf '%s\n' "$unified_code" > /tmp/container-readiness/unified-status.txt
          printf '%s\n' "$unauthenticated_unified_code" > /tmp/container-readiness/unified-unauthenticated-status.txt
          test "$(docker exec estimador-cag id -u)" != "0"
          if [ "$ready" != "true" ] || [ "$unified_code" != "200" ] || [ "$unauthenticated_unified_code" != "401" ]; then
            echo "Container failed production identity/readiness gate"
            cat /tmp/container-readiness/startup.json 2>/dev/null || true
            cat /tmp/container-readiness/health.json 2>/dev/null || true
            cat /tmp/container-readiness/ready.json 2>/dev/null || true
            cat /tmp/container-readiness/version.json 2>/dev/null || true
            cat /tmp/container-readiness/unified-ready.json 2>/dev/null || true
            cat /tmp/container-readiness/unified-unauthenticated.json 2>/dev/null || true
            false
          fi
      - name: Upload container readiness evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-readiness-evidence-${{ env.EXPECTED_HEAD_SHA }}
          path: /tmp/container-readiness
          if-no-files-found: error
          retention-days: 14
      - name: Verify sanitized readiness and release identity
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          expected_sha = os.environ['EXPECTED_HEAD_SHA']
          startup = json.loads(Path('/tmp/container-readiness/startup.json').read_text())
          payload = json.loads(Path('/tmp/container-readiness/ready.json').read_text())
          version = json.loads(Path('/tmp/container-readiness/version.json').read_text())
          serialized = json.dumps(payload).lower()
          assert startup == {'status': 'started', 'started': True}
          assert payload['ready'] is True
          assert payload['status'] == 'ready'
          assert payload['configured_providers'] == ['deepseek']
          assert payload['ownership_restart_persistent'] is True
          assert payload['identity_required'] is True
          assert version['git_sha'] == expected_sha
          assert 'container-smoke-provider' not in serialized
          assert 'database_url' not in serialized
          assert 'redis_url' not in serialized

          unified = json.loads(
              Path('/tmp/container-readiness/unified-ready.json').read_text()
          )
          serialized_unified = json.dumps(unified).lower()
          assert unified['ready'] is True
          assert unified['graph_name'] == 'session13_14_plus_unified_graph'
          assert '/api/v1/estimate/graph' in unified['rollback_paths']
          assert 'container-smoke-provider' not in serialized_unified
          assert 'database_url' not in serialized_unified
          PY
      - name: Stop smoke container
        if: always()
        run: docker rm --force estimador-cag 2>/dev/null || true
