name: CI - Estimador CAG

on:
  push:
    branches:
      - main
      - EACHAT
      - finalproject-GGC
      - "gg-*"
      - "sesion-*"
      - "session*"
  pull_request:
  workflow_dispatch:

jobs:
  test-estimador-cag:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: estimador-cag
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      OPENAI_API_KEY: test
      DEEPSEEK_API_KEY: test
      KIMI_API_KEY: test
      LANGGRAPH_STRICT_MSGPACK: "true"
      PYTHONUNBUFFERED: "1"
      UV_HTTP_TIMEOUT: "300"

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.EXPECTED_HEAD_SHA }}

      - name: Verify exact checked-out SHA
        run: |
          ACTUAL_HEAD_SHA=$(git rev-parse HEAD)
          printf '%s\n' "$ACTUAL_HEAD_SHA" | tee /tmp/checked-out-sha.txt
          test "$ACTUAL_HEAD_SHA" = "$EXPECTED_HEAD_SHA"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Ruff
        run: |
          set -o pipefail
          TARGETS="app tests"
          test -f streamlit_app.py && TARGETS="$TARGETS streamlit_app.py"
          test -f energy_chat_streamlit_app.py && TARGETS="$TARGETS energy_chat_streamlit_app.py"
          test -d evals && TARGETS="$TARGETS evals"
          uv run ruff check $TARGETS 2>&1 | tee /tmp/ruff-output.txt

      - name: Upload Ruff output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-output
          path: |
            /tmp/checked-out-sha.txt
            /tmp/ruff-output.txt
          if-no-files-found: ignore

      - name: Compile Python
        run: uv run python -m py_compile $(find app tests evals -name '*.py' -type f 2>/dev/null) streamlit_app.py energy_chat_streamlit_app.py

      - name: Tests
        run: |
          set -o pipefail
          uv run pytest -q 2>&1 | tee /tmp/pytest-output.txt

      - name: Upload pytest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: /tmp/pytest-output.txt

      - name: Energy Chat validation gate
        if: ${{ hashFiles('estimador-cag/scripts/validate_energy_chat.sh') != '' }}
        run: bash scripts/validate_energy_chat.sh

  test-energy-chat-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eachat
          POSTGRES_PASSWORD: eachat_test
          POSTGRES_DB: eachat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eachat -d eachat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: estimador-cag
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      OPENAI_API_KEY: test
      DEEPSEEK_API_KEY: test
      KIMI_API_KEY: test
      EACHAT_POSTGRES_URL: postgresql://eachat:eachat_test@localhost:5432/eachat_test
      LANGGRAPH_STRICT_MSGPACK: "true"
      PYTHONUNBUFFERED: "1"
      UV_HTTP_TIMEOUT: "300"

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.EXPECTED_HEAD_SHA }}

      - name: Verify exact checked-out SHA
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra postgres

      - name: PostgreSQL integration tests
        run: |
          set -o pipefail
          uv run pytest -q tests/test_energy_chat_postgres_runtime.py 2>&1 | tee /tmp/postgres-pytest-output.txt

      - name: Upload PostgreSQL pytest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-pytest-output
          path: /tmp/postgres-pytest-output.txt

  test-energy-chat-browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: estimador-cag
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      OPENAI_API_KEY: test
      DEEPSEEK_API_KEY: test
      KIMI_API_KEY: test
      EACHAT_V2_ENABLED: "true"
      EACHAT_BROWSER_BASE_URL: http://127.0.0.1:8000
      EACHAT_BROWSER_SCREENSHOT: /tmp/eachat-v2-browser.png
      LANGGRAPH_STRICT_MSGPACK: "true"
      PYTHONUNBUFFERED: "1"
      UV_HTTP_TIMEOUT: "300"

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.EXPECTED_HEAD_SHA }}

      - name: Verify exact checked-out SHA
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install application dependencies
        run: uv sync --frozen --extra dev

      - name: Install pinned browser runner
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start FastAPI product server
        run: |
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/eachat-browser-server.log 2>&1 &
          echo $! > /tmp/eachat-browser-server.pid
          SERVER_READY=0
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8000/health > /tmp/eachat-health.json; then
              SERVER_READY=1
              break
            fi
            sleep 1
          done
          test "$SERVER_READY" = "1"

      - name: Run V2 browser journey
        run: node scripts/smoke_eachat_v2_browser.mjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eachat-v2-browser-evidence
          path: |
            /tmp/eachat-v2-browser.png
            /tmp/eachat-browser-server.log
            /tmp/eachat-health.json
          if-no-files-found: warn

      - name: Stop FastAPI product server
        if: always()
        run: |
          if test -f /tmp/eachat-browser-server.pid; then
            kill "$(cat /tmp/eachat-browser-server.pid)" 2>/dev/null || true
          fi

  test-energy-chat-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: estimador-cag
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      OPENAI_API_KEY: test
      DEEPSEEK_API_KEY: test
      KIMI_API_KEY: test
      LANGGRAPH_STRICT_MSGPACK: "true"
      PYTHONUNBUFFERED: "1"
      UV_HTTP_TIMEOUT: "300"

    steps:
      - name: Checkout exact branch head with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.EXPECTED_HEAD_SHA }}

      - name: Verify exact checked-out SHA
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scan tracked files and branch history for secrets
        run: python scripts/security_scan_eachat.py --base-ref origin/EACHAT --report /tmp/eachat-secret-scan.json

      - name: Install coursework test dependencies
        run: uv sync --frozen --extra dev

      - name: Run public and production security contract tests
        run: |
          set -o pipefail
          uv run pytest -q tests/test_energy_chat_security.py tests/test_energy_chat_production_app.py 2>&1 | tee /tmp/security-pytest-output.txt

      - name: Resolve isolated production lock
        run: uv lock --project deploy/eachat

      - name: Verify audited production lock digest
        run: cd deploy/eachat && sha256sum --check uv.lock.sha256

      - name: Export isolated production dependencies
        run: uv export --project deploy/eachat --frozen --no-dev --format requirements-txt --output-file /tmp/eachat-production-requirements.txt

      - name: Audit isolated production dependencies
        run: uvx --from pip-audit==2.10.1 pip-audit --requirement /tmp/eachat-production-requirements.txt --strict --format json --output /tmp/eachat-pip-audit.json

      - name: Install isolated production environment
        run: |
          uv venv /tmp/eachat-production-venv --python 3.11
          uv pip install --python /tmp/eachat-production-venv/bin/python --requirement /tmp/eachat-production-requirements.txt

      - name: Smoke isolated production service
        env:
          EACHAT_ALLOW_IN_MEMORY: "true"
          PYTHONPATH: .
        run: |
          /tmp/eachat-production-venv/bin/uvicorn app.energy_chat.production_app:app --host 127.0.0.1 --port 8010 > /tmp/eachat-production-server.log 2>&1 &
          echo $! > /tmp/eachat-production-server.pid
          SERVER_READY=0
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8010/health > /tmp/eachat-production-health.json; then
              SERVER_READY=1
              break
            fi
            sleep 1
          done
          test "$SERVER_READY" = "1"
          grep -q '"strict_msgpack":true' /tmp/eachat-production-health.json
          curl -fsS -X POST http://127.0.0.1:8010/energy-chat/v2/chat \
            -H 'Content-Type: application/json' \
            -d '{"user_message":"Explain the safest production validation step."}' \
            > /tmp/eachat-production-response.json
          grep -q 'energy_card_v2' /tmp/eachat-production-response.json
          if grep -q 'Deserializing unregistered type' /tmp/eachat-production-server.log; then
            echo 'Strict checkpoint deserialization emitted an unregistered-type warning.'
            false
          fi

      - name: Upload security and production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eachat-security-evidence
          path: |
            /tmp/eachat-secret-scan.json
            /tmp/security-pytest-output.txt
            /tmp/eachat-production-requirements.txt
            /tmp/eachat-pip-audit.json
            /tmp/eachat-production-health.json
            /tmp/eachat-production-response.json
            /tmp/eachat-production-server.log
            ${{ github.workspace }}/estimador-cag/deploy/eachat/uv.lock
            ${{ github.workspace }}/estimador-cag/deploy/eachat/uv.lock.sha256
          if-no-files-found: warn

      - name: Stop isolated production service
        if: always()
        run: |
          if test -f /tmp/eachat-production-server.pid; then
            kill "$(cat /tmp/eachat-production-server.pid)" 2>/dev/null || true
          fi
