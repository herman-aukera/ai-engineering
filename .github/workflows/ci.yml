name: CI - Estimador CAG

on:
  push:
    branches:
      - main
      - "gg-*"
      - "sesion-*"
      - "session*"
      - EACODE
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-estimador-cag:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: estimador-cag
    env:
      EXPECTED_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      DEEPSEEK_API_KEY: test
      KIMI_API_KEY: test
      OPENAI_API_KEY: test
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 0

      - name: Verify exact checked-out SHA
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Ruff
        run: |
          TARGETS="app tests"
          test -f streamlit_app.py && TARGETS="$TARGETS streamlit_app.py"
          test -d evals && TARGETS="$TARGETS evals"
          test -d energy_core && TARGETS="$TARGETS energy_core"
          test -d scripts && TARGETS="$TARGETS scripts"
          test -d ../energy_core && TARGETS="$TARGETS ../energy_core"
          test -f ../scripts/energy_core_root_smoke.py && TARGETS="$TARGETS ../scripts/energy_core_root_smoke.py"
          uv run ruff check $TARGETS

      - name: Compile Python
        run: uv run python -m py_compile $(find app tests evals energy_core scripts ../energy_core ../scripts -name '*.py' -type f 2>/dev/null)

      - name: Energy Core Boundary
        run: |
          if test -d energy_core && test -f scripts/energy_core_boundary_check.py; then
            uv run python scripts/energy_core_boundary_check.py
          else
            echo "Energy Core boundary check skipped because script or package is absent."
          fi

      - name: Deterministic tests
        run: uv run pytest -q -m "not live_provider"

      - name: Session 15 EACODE contract tests
        run: uv run pytest -q tests/test_eacode_session15_production_contract.py tests/test_eacode_ci_contract.py

      - name: Keyless EACODE production smoke
        run: uv run pytest -q tests/smoke/test_eacode_production_smoke.py

      - name: Session 15 EACODE production contract
        run: uv run python scripts/session15_eacode_production_contract.py

      - name: Energy Core Smoke
        run: |
          if test -d energy_core && test -f scripts/energy_core_smoke.py; then
            uv run python scripts/energy_core_smoke.py
          else
            echo "Energy Core smoke skipped because script or package is absent."
          fi

      - name: Energy Core Example Smoke
        run: |
          if test -d energy_core && test -f scripts/energy_core_example_smoke.py; then
            uv run python scripts/energy_core_example_smoke.py
          else
            echo "Energy Core example smoke skipped because script or package is absent."
          fi

      - name: Energy Core Constraint Smoke
        run: |
          if test -d energy_core && test -f scripts/energy_core_constraint_smoke.py; then
            uv run python scripts/energy_core_constraint_smoke.py
          else
            echo "Energy Core constraint smoke skipped because script or package is absent."
          fi

      - name: Energy Core Critic Coverage Smoke
        run: |
          if test -d energy_core && test -f scripts/energy_core_critic_coverage_smoke.py; then
            uv run python scripts/energy_core_critic_coverage_smoke.py
          else
            echo "Energy Core critic coverage smoke skipped because script or package is absent."
          fi

      - name: Energy Core Ledger Integrity Smoke
        run: |
          if test -d energy_core && test -f scripts/energy_core_ledger_integrity_smoke.py; then
            uv run python scripts/energy_core_ledger_integrity_smoke.py
          else
            echo "Energy Core ledger integrity smoke skipped because script or package is absent."
          fi

      - name: Energy Core Nightly Status Smoke
        run: |
          if test -d energy_core && test -f scripts/energy_core_nightly_status_smoke.py; then
            uv run python scripts/energy_core_nightly_status_smoke.py
          else
            echo "Energy Core nightly status smoke skipped because script or package is absent."
          fi

      - name: Energy Core Release Smoke
        run: |
          if test -d energy_core && test -f scripts/energy_core_release_smoke.py; then
            uv run python scripts/energy_core_release_smoke.py
          else
            echo "Energy Core release smoke skipped because script or package is absent."
          fi

      - name: Energy Core Package Smoke
        run: |
          if test -d energy_core && test -f scripts/energy_core_package_smoke.py; then
            uv run python scripts/energy_core_package_smoke.py
          else
            echo "Energy Core package smoke skipped because script or package is absent."
          fi

      - name: Energy Core Reviewer Smoke
        run: |
          if test -d energy_core && test -f scripts/energy_core_reviewer_smoke.py; then
            uv run python scripts/energy_core_reviewer_smoke.py
          else
            echo "Energy Core reviewer smoke skipped because script is absent."
          fi

      - name: Energy Core Command Catalog Smoke
        run: |
          if test -d energy_core && test -f scripts/energy_core_command_catalog_smoke.py; then
            uv run python scripts/energy_core_command_catalog_smoke.py
          else
            echo "Energy Core command catalog smoke skipped because script or package is absent."
          fi

      - name: Energy Core Review Pack Smoke
        run: |
          if test -d energy_core && test -f scripts/energy_core_review_pack_smoke.py; then
            uv run python scripts/energy_core_review_pack_smoke.py
          else
            echo "Energy Core review pack smoke skipped because script or package is absent."
          fi

      - name: Energy Core Scaffold Smoke
        run: |
          if test -d energy_core && test -f scripts/energy_core_scaffold_smoke.py; then
            uv run python scripts/energy_core_scaffold_smoke.py
          else
            echo "Energy Core scaffold smoke skipped because script or package is absent."
          fi

      - name: Energy Core Export Plan Smoke
        run: |
          if test -d energy_core && test -f scripts/energy_core_export_plan_smoke.py; then
            uv run python scripts/energy_core_export_plan_smoke.py
          else
            echo "Energy Core export plan smoke skipped because script or package is absent."
          fi

      - name: Energy Core Extraction Readiness Smoke
        run: |
          if test -d energy_core && test -f scripts/energy_core_extraction_readiness_smoke.py; then
            uv run python scripts/energy_core_extraction_readiness_smoke.py
          else
            echo "Energy Core extraction readiness smoke skipped because script or package is absent."
          fi

      - name: Energy Core Full Gate
        run: |
          if test -d energy_core && test -f scripts/energy_core_full_gate.py; then
            uv run python scripts/energy_core_full_gate.py
          else
            echo "Energy Core full gate skipped because script or package is absent."
          fi

      - name: Energy Core Root Smoke
        working-directory: .
        run: |
          if test -d energy_core && test -f scripts/energy_core_root_smoke.py; then
            estimador-cag/.venv/bin/python scripts/energy_core_root_smoke.py
          else
            echo "Energy Core root smoke skipped because root shim or script is absent."
          fi

      - name: Diff and tracked-secret gates
        working-directory: .
        run: |
          git diff --check
          matches="$(git grep -n -E 'sk-[A-Za-z0-9_-]{20,}|Bearer [A-Za-z0-9._-]{20,}|BEGIN (RSA|OPENSSH|PRIVATE) KEY' -- . ':!*.lock' || true)"
          unapproved="$(printf '%s\n' "$matches" | grep -v '# test-secret-fixture' || true)"
          if [ -n "$unapproved" ]; then
            echo "Potential secret in tracked files"
            printf '%s\n' "$unapproved" | cut -d: -f1-2
            false
          fi

      - name: Git status check
        working-directory: .
        run: |
          if test -n "$(git status --short)"; then
            git status --short
            echo "Repository is dirty after CI smoke checks."
            exit 1
          fi
          echo "Repository stayed clean after CI smoke checks."

  eacode-production-envelope:
    if: >-
      (github.event_name == 'push' && github.ref_name == 'EACODE') ||
      (github.event_name == 'pull_request' && github.head_ref == 'EACODE') ||
      github.event_name == 'workflow_dispatch'
    needs: test-estimador-cag
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eacode
          POSTGRES_PASSWORD: eacode_test
          POSTGRES_DB: eacode_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eacode -d eacode_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      EXPECTED_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      EACODE_DATABASE_URL: postgresql://eacode:eacode_test@127.0.0.1:5432/eacode_test
      EACODE_SESSION_SIGNING_KEY: ci-eacode-production-envelope-signing-key-32-bytes
    steps:
      - name: Checkout exact validation head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_HEAD_SHA }}
          fetch-depth: 0

      - name: Verify exact checked-out SHA
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install migration runtime
        working-directory: estimador-cag
        run: uv sync --frozen --no-dev

      - name: Apply versioned authority migration
        working-directory: estimador-cag
        run: uv run python -m energy_core.postgres_beta_store migrate

      - name: Export frozen production requirements
        working-directory: estimador-cag
        run: >-
          uv export --frozen --no-dev --no-emit-project
          --format requirements-txt
          --output-file deploy/eacode/requirements.generated.txt

      - name: Build isolated non-root image
        working-directory: estimador-cag
        run: docker build --file deploy/eacode/Dockerfile --tag "eacode-canary:${EXPECTED_HEAD_SHA}" .

      - name: Start isolated production service and exercise public v1 API
        run: |
          docker run --detach --name eacode-canary \
            --network host \
            --env GIT_SHA="$EXPECTED_HEAD_SHA" \
            --env EACODE_DATABASE_URL="$EACODE_DATABASE_URL" \
            --env EACODE_SESSION_SIGNING_KEY="$EACODE_SESSION_SIGNING_KEY" \
            "eacode-canary:${EXPECTED_HEAD_SHA}"
          ready=0
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/ready > /tmp/eacode-ready.json; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = "1"
          curl -fsS http://127.0.0.1:8000/startup > /tmp/eacode-startup.json
          curl -fsS http://127.0.0.1:8000/health > /tmp/eacode-health.json
          curl -fsS http://127.0.0.1:8000/version > /tmp/eacode-version.json
          curl -fsS http://127.0.0.1:8000/api/v1/eacode/status > /tmp/eacode-status.json
          curl -fsS http://127.0.0.1:8000/api/v1/eacode/capabilities > /tmp/eacode-capabilities.json
          curl -fsS -X POST http://127.0.0.1:8000/api/v1/eacode/select \
            -H 'Content-Type: application/json' \
            --data '{}' > /tmp/eacode-selection.json
          test "$(docker exec eacode-canary id -u)" != "0"

      - name: Verify production claim boundary and integration response
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          expected_sha = os.environ['EXPECTED_HEAD_SHA']
          ready = json.loads(Path('/tmp/eacode-ready.json').read_text())
          status = json.loads(Path('/tmp/eacode-status.json').read_text())
          version = json.loads(Path('/tmp/eacode-version.json').read_text())
          capabilities = json.loads(Path('/tmp/eacode-capabilities.json').read_text())
          selection = json.loads(Path('/tmp/eacode-selection.json').read_text())

          assert ready == {
              'status': 'ready',
              'ready': True,
              'control_plane': 'deterministic',
              'authority_store': 'postgresql',
          }
          assert status['control_plane'] == 'deterministic'
          assert status['provider_selection'] == 'planned_only'
          assert status['served_provider_evidence'] == 'requires_opt_in_live_call'
          assert status['live_process_execution_enabled'] is False
          assert version['git_sha'] == expected_sha
          assert capabilities['status'] == 'ok'
          assert capabilities['count'] > 0
          assert selection['status'] == 'ok'
          assert selection['served'] is None
          assert 'not proof' in selection['claim_boundary']
          PY

      - name: Capture container evidence
        if: always()
        run: |
          mkdir -p /tmp/eacode-envelope
          cp /tmp/eacode-*.json /tmp/eacode-envelope/ 2>/dev/null || true
          docker logs eacode-canary > /tmp/eacode-envelope/container.log 2>&1 || true
          docker image inspect "eacode-canary:${EXPECTED_HEAD_SHA}" > /tmp/eacode-envelope/image-inspect.json 2>/dev/null || true

      - name: Upload production-envelope evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eacode-production-envelope-${{ env.EXPECTED_HEAD_SHA }}
          path: /tmp/eacode-envelope
          if-no-files-found: error
          retention-days: 14

      - name: Stop canary
        if: always()
        run: docker rm --force eacode-canary 2>/dev/null || true
