name: CI - Estimador CAG

on:
  push:
    branches:
      - main
      - "gg-**"
      - "sesion-**"
      - "session**"
  pull_request:
  workflow_dispatch:

jobs:
  test-estimador-cag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: estimador-cag
    env:
      OPENAI_API_KEY: test
      DEEPSEEK_API_KEY: test
      KIMI_API_KEY: test
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Ruff
        run: |
          TARGETS="app tests scripts"
          test -f streamlit_app.py && TARGETS="$TARGETS streamlit_app.py"
          test -d evals && TARGETS="$TARGETS evals"
          uv run ruff check $TARGETS

      - name: Compile Python
        run: uv run python -m py_compile $(find app tests evals scripts -name '*.py' -type f 2>/dev/null)

      - name: Deterministic tests
        id: deterministic-tests
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p artifacts/session14
          uv run pytest -q -m "not live_provider" --tb=short 2>&1 | tee artifacts/session14/ci_test_output.txt

      - name: Record deterministic CI result
        if: always()
        working-directory: .
        env:
          TEST_OUTCOME: ${{ steps.deterministic-tests.outcome }}
          SOURCE_SHA: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          output_path = Path("estimador-cag/artifacts/session14/ci_test_output.txt")
          summary_path = Path("estimador-cag/artifacts/session14/ci_test_status.json")
          output = output_path.read_text(encoding="utf-8") if output_path.exists() else ""
          lines = output.splitlines()
          payload = {
              "schema_version": "session14.ci_test_status.v1",
              "source_sha": os.getenv("SOURCE_SHA"),
              "workflow_run_id": os.getenv("WORKFLOW_RUN_ID"),
              "outcome": os.getenv("TEST_OUTCOME") or "not_run",
              "tail": lines[-240:],
          }
          summary_path.parent.mkdir(parents=True, exist_ok=True)
          summary_path.write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estimador-cag/artifacts/session14/ci_test_status.json
          if git diff --cached --quiet; then
            echo "Deterministic CI status is already current."
          else
            git commit -m "session14: evidence(ci): record deterministic test result"
            git push origin HEAD:session-14/pre-work
          fi

      - name: Diff and secret gates
        if: steps.deterministic-tests.outcome == 'success'
        working-directory: .
        run: |
          git diff --check
          if git grep -n -E 'sk-[A-Za-z0-9_-]{20,}|BEGIN (RSA|OPENSSH|PRIVATE) KEY' -- . ':!*.lock'; then
            echo "Potential secret in tracked files"
            false
          fi

      - name: Enforce deterministic test gate
        if: always()
        working-directory: .
        env:
          TEST_OUTCOME: ${{ steps.deterministic-tests.outcome }}
        run: test "$TEST_OUTCOME" = "success"

  session14-hosted-evidence:
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/session-14/pre-work'
    needs: test-estimador-cag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: lidr
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lidr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: estimador-cag
    env:
      LOGFIRE_TOKEN: ${{ secrets.SESSION14_LOGFIRE_TOKEN }}
      LOGFIRE_SEND_TO_LOGFIRE: "true"
      LOGFIRE_SERVICE_NAME: estimador-cag
      LOGFIRE_ENVIRONMENT: session14-delivery-evidence
      LOGFIRE_QUERY_BASE_URL: https://logfire-eu.pydantic.dev
      SESSION14_POSTGRES_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lidr
      SESSION14_HOSTED_EVIDENCE_PATH: artifacts/session14/hosted_pause_resume_evidence.json
      OPENAI_API_KEY: test
      DEEPSEEK_API_KEY: test
      KIMI_API_KEY: test
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: session-14/pre-work

      - name: Detect hosted evidence secret
        id: evidence-secret
        shell: bash
        run: |
          if [ -n "$LOGFIRE_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "SESSION14_LOGFIRE_TOKEN is not configured."
          fi

      - name: Install uv
        if: >-
          needs.test-estimador-cag.result == 'success' &&
          steps.evidence-secret.outputs.enabled == 'true'
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        if: >-
          needs.test-estimador-cag.result == 'success' &&
          steps.evidence-secret.outputs.enabled == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: >-
          needs.test-estimador-cag.result == 'success' &&
          steps.evidence-secret.outputs.enabled == 'true'
        run: uv sync --frozen --extra dev

      - name: Capture hosted ORBITA pause and resume trace
        id: capture
        if: >-
          needs.test-estimador-cag.result == 'success' &&
          steps.evidence-secret.outputs.enabled == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p artifacts/session14
          uv run python scripts/session14_hosted_evidence.py 2>&1 | tee artifacts/session14/hosted_capture_output.txt

      - name: Record hosted evidence result in branch
        if: always()
        working-directory: .
        env:
          TEST_RESULT: ${{ needs.test-estimador-cag.result }}
          SECRET_ENABLED: ${{ steps.evidence-secret.outputs.enabled }}
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
          SOURCE_SHA: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence_path = Path("estimador-cag/artifacts/session14/hosted_pause_resume_evidence.json")
          output_path = Path("estimador-cag/artifacts/session14/hosted_capture_output.txt")
          status_path = Path("estimador-cag/artifacts/session14/hosted_evidence_status.json")
          evidence = None
          if evidence_path.exists():
              evidence = json.loads(evidence_path.read_text(encoding="utf-8"))

          output = output_path.read_text(encoding="utf-8") if output_path.exists() else ""
          token = os.getenv("LOGFIRE_TOKEN", "")
          if token:
              output = output.replace(token, "[REDACTED]")
          output = output.replace("Authorization: Bearer ", "Authorization: Bearer [REDACTED]")

          test_result = os.getenv("TEST_RESULT") or "unknown"
          secret_enabled = os.getenv("SECRET_ENABLED") == "true"
          capture_outcome = os.getenv("CAPTURE_OUTCOME") or "not_run"
          complete = (
              test_result == "success"
              and secret_enabled
              and capture_outcome == "success"
              and isinstance(evidence, dict)
          )
          payload = {
              "schema_version": "session14.hosted_evidence_status.v1",
              "source_sha": os.getenv("SOURCE_SHA"),
              "workflow_run_id": os.getenv("WORKFLOW_RUN_ID"),
              "workflow_run_attempt": os.getenv("WORKFLOW_RUN_ATTEMPT"),
              "test_result": test_result,
              "secret_configured": secret_enabled,
              "capture_outcome": capture_outcome,
              "evidence_complete": complete,
              "trace_id": evidence.get("trace_id") if isinstance(evidence, dict) else None,
              "root_span_id": evidence.get("root_span_id") if isinstance(evidence, dict) else None,
              "thread_id": evidence.get("thread_id") if isinstance(evidence, dict) else None,
              "pause_status": evidence.get("pause_status") if isinstance(evidence, dict) else None,
              "resume_status": evidence.get("resume_status") if isinstance(evidence, dict) else None,
              "public_trace_url": evidence.get("public_trace_url") if isinstance(evidence, dict) else None,
              "tail": output.splitlines()[-180:],
          }
          status_path.parent.mkdir(parents=True, exist_ok=True)
          status_path.write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estimador-cag/artifacts/session14/hosted_evidence_status.json
          if [ -f estimador-cag/artifacts/session14/hosted_pause_resume_evidence.json ]; then
            git add estimador-cag/artifacts/session14/hosted_pause_resume_evidence.json
          fi
          if git diff --cached --quiet; then
            echo "Hosted evidence status is already current."
          else
            git commit -m "session14: evidence(hosted): record ORBITA capture"
            git push origin HEAD:session-14/pre-work
          fi

      - name: Upload sanitized hosted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session14-hosted-pause-resume-${{ github.sha }}
          path: |
            estimador-cag/artifacts/session14/hosted_evidence_status.json
            estimador-cag/artifacts/session14/hosted_pause_resume_evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce hosted evidence gate
        if: always()
        working-directory: .
        env:
          TEST_RESULT: ${{ needs.test-estimador-cag.result }}
          SECRET_ENABLED: ${{ steps.evidence-secret.outputs.enabled }}
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
        run: |
          test "$TEST_RESULT" = "success"
          test "$SECRET_ENABLED" = "true"
          test "$CAPTURE_OUTCOME" = "success"
