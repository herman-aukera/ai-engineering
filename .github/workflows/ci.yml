name: CI - Estimador CAG

on:
  push:
    branches:
      - main
      - "gg-**"
      - "sesion-**"
      - "session**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-estimador-cag:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: estimador-cag
    env:
      OPENAI_API_KEY: test
      DEEPSEEK_API_KEY: test
      KIMI_API_KEY: test
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Ruff
        run: |
          TARGETS="app tests scripts"
          test -f streamlit_app.py && TARGETS="$TARGETS streamlit_app.py"
          test -d evals && TARGETS="$TARGETS evals"
          uv run ruff check $TARGETS > /tmp/readiness-final-ruff.log 2>&1 || {
            cat /tmp/readiness-final-ruff.log
            false
          }
          cat /tmp/readiness-final-ruff.log
      - name: Upload final Ruff diagnostic
        if: failure() && github.head_ref == 'gg-session-13/plus-production-readiness'
        uses: actions/upload-artifact@v4
        with:
          name: readiness-final-ruff-${{ github.sha }}
          path: /tmp/readiness-final-ruff.log
          if-no-files-found: error
          retention-days: 7
      - name: Compile Python
        run: uv run python -m py_compile $(find app tests evals scripts -name '*.py' -type f 2>/dev/null)
      - name: Deterministic tests
        run: uv run pytest -q -m "not live_provider"
      - name: Diff and secret gates
        working-directory: .
        run: |
          git diff --check
          if git grep -n -E 'sk-[A-Za-z0-9_-]{20,}|BEGIN (RSA|OPENSSH|PRIVATE) KEY' -- . ':!*.lock'; then
            echo "Potential secret in tracked files"
            false
          fi

  provider-readiness:
    if: github.head_ref == 'gg-session-13/plus-production-readiness'
    needs: test-estimador-cag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: estimador-cag
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DEEPSEEK_BASE_URL: https://api.deepseek.com/v1
      KIMI_BASE_URL: https://api.moonshot.ai/v1
      OPENAI_BASE_URL: https://api.openai.com/v1
      KIMI_BENCHMARK_ROUTES: ${{ vars.KIMI_BENCHMARK_ROUTES }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Run matched provider benchmark
        run: uv run python scripts/provider_readiness_benchmark.py
      - name: Upload sanitized provider evidence
        uses: actions/upload-artifact@v4
        with:
          name: session13-plus-provider-readiness-${{ github.sha }}
          path: estimador-cag/artifacts/provider-readiness
          if-no-files-found: error
          retention-days: 30

  container-readiness:
    if: github.head_ref == 'gg-session-13/plus-production-readiness'
    needs: test-estimador-cag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: lidr
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lidr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t estimador-cag:${{ github.sha }} estimador-cag
      - name: Run production image
        run: |
          docker run --detach --name estimador-cag \
            --network host \
            --env DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/lidr \
            --env REDIS_URL=redis://127.0.0.1:6379/0 \
            --env DEEPSEEK_API_KEY=container-smoke-provider \
            --env KIMI_API_KEY=dummy \
            --env OPENAI_API_KEY=dummy \
            --env GRAPH_RETRIEVAL_MODE=parallel \
            --env GRAPH_RETRIEVAL_MAX_CONCURRENCY=4 \
            estimador-cag:${{ github.sha }}
      - name: Probe liveness and readiness
        run: |
          mkdir -p /tmp/container-readiness
          ready=false
          health_code=000
          ready_code=000
          for attempt in $(seq 1 40); do
            health_code=$(curl --silent --connect-timeout 1 --max-time 2 --output /tmp/container-readiness/health.json --write-out '%{http_code}' http://127.0.0.1:8000/health || true)
            ready_code=$(curl --silent --connect-timeout 1 --max-time 2 --output /tmp/container-readiness/ready.json --write-out '%{http_code}' http://127.0.0.1:8000/ready || true)
            if [ "$health_code" = "200" ] && [ "$ready_code" = "200" ]; then
              ready=true
              break
            fi
            sleep 3
          done
          docker logs estimador-cag > /tmp/container-readiness/container.log 2>&1 || true
          docker inspect estimador-cag --format '{{json .State}}' > /tmp/container-readiness/container-state.json || true
          printf '%s\n' "$health_code" > /tmp/container-readiness/health-status.txt
          printf '%s\n' "$ready_code" > /tmp/container-readiness/ready-status.txt
          if [ "$ready" != "true" ]; then
            echo "Container failed readiness gate"
            cat /tmp/container-readiness/health.json 2>/dev/null || true
            cat /tmp/container-readiness/ready.json 2>/dev/null || true
            false
          fi
      - name: Upload container readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-readiness-evidence-${{ github.sha }}
          path: /tmp/container-readiness
          if-no-files-found: error
          retention-days: 14
      - name: Verify sanitized readiness payload
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/container-readiness/ready.json').read_text())
          serialized = json.dumps(payload).lower()
          assert payload['ready'] is True
          assert payload['status'] == 'ready'
          assert payload['configured_providers'] == ['deepseek']
          assert 'container-smoke-provider' not in serialized
          assert 'database_url' not in serialized
          assert 'redis_url' not in serialized
          PY
