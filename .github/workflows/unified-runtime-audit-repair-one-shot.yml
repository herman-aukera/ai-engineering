name: Unified runtime audit repair one-shot

on:
  push:
    branches:
      - gg-session-14/plus-consolidated

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout writable consolidation branch
        uses: actions/checkout@v4
        with:
          ref: gg-session-14/plus-consolidated
          fetch-depth: 0

      - name: Install matching Ruff
        uses: astral-sh/setup-uv@v5

      - name: Repair unified composition and exact-head gates
        run: |
          python - <<'PY'
          from pathlib import Path

          build = Path("estimador-cag/app/generation/graph/unified_build.py")
          text = build.read_text(encoding="utf-8")

          classifier_old = (
              "node=build_semantic_classify_node("
              "classifier=semantic_classifier),"
          )
          classifier_new = '''node=build_semantic_classify_node(
              classifier=semantic_classifier,
              destination="structure_core",
          ),'''
          if text.count(classifier_old) != 1:
              raise SystemExit("expected one unified semantic classifier call")
          text = text.replace(classifier_old, classifier_new, 1)

          helper_anchor = "\ndef build_unified_structure_phase(\n"
          helper = '''
+
+def _restore_source_transcript_node():
+    async def restore_source_transcript(
+        state: UnifiedEstimationGraphState,
+    ) -> UnifiedEstimationGraphState:
+        source_transcript = state.get("pre_reformulation_transcript")
+        if not isinstance(source_transcript, str) or not source_transcript.strip():
+            raise ValueError(
+                "unified structure phase lost the source transcript"
+            )
+        return {
+            "transcript": source_transcript,
+            "trace_events": [
+                {
+                    "event_type": "source_transcript_restored",
+                    "node": "restore_source_transcript",
+                    "summary": (
+                        "Restored the immutable source transcript after "
+                        "structure processing."
+                    ),
+                    "evidence_refs": [],
+                    "state_delta_keys": ["transcript", "trace_events"],
+                }
+            ],
+        }
+
+    return restore_source_transcript
+'''.replace("\n+", "\n")
          if "def _restore_source_transcript_node" not in text:
              if helper_anchor not in text:
                  raise SystemExit("unified structure builder anchor missing")
              text = text.replace(helper_anchor, helper + helper_anchor, 1)

          node_anchor = '    builder.add_node("structure_core", structure_core)\n'
          restore_node = '''    builder.add_node("structure_core", structure_core)
+    builder.add_node(
+        "restore_source_transcript",
+        instrument_reviewed_graph_node(
+            graph_name=UNIFIED_STRUCTURE_PHASE_NAME,
+            node_name="restore_source_transcript",
+            node=_restore_source_transcript_node(),
+            tracer=tracer,
+        ),
+    )
+'''.replace("\n+", "\n")
          if text.count(node_anchor) != 1:
              raise SystemExit("structure_core node anchor missing")
          text = text.replace(node_anchor, restore_node, 1)

          edge_old = (
              '    builder.add_edge("semantic_classify", "structure_core")\n'
              '    builder.add_edge("structure_core", END)\n'
          )
          edge_new = (
              '    builder.add_edge("semantic_classify", "structure_core")\n'
              '    builder.add_edge(\n'
              '        "structure_core", "restore_source_transcript"\n'
              '    )\n'
              '    builder.add_edge("restore_source_transcript", END)\n'
          )
          if text.count(edge_old) != 1:
              raise SystemExit("structure phase terminal edge missing")
          text = text.replace(edge_old, edge_new, 1)
          build.write_text(text, encoding="utf-8")

          tests = Path(
              "estimador-cag/tests/test_session13_14_unified_authority.py"
          )
          text = tests.read_text(encoding="utf-8")
          import_old = (
              "from app.generation.graph.unified_build import "
              "_human_gate_to_supervisor\n"
          )
          import_new = '''from app.generation.graph.unified_build import (
+    _human_gate_to_supervisor,
+    _restore_source_transcript_node,
+)
+'''.replace("\n+", "\n")
          if import_old in text:
              text = text.replace(import_old, import_new, 1)
          elif "_restore_source_transcript_node" not in text:
              raise SystemExit("authority test import anchor missing")

          addition = '''
+
+@pytest.mark.asyncio
+async def test_structure_phase_restores_exact_source_transcript() -> None:
+    update = await _restore_source_transcript_node()(
+        {
+            "transcript": "Canonical structure brief",
+            "pre_reformulation_transcript": "Original source request",
+        }
+    )
+
+    assert update["transcript"] == "Original source request"
+    assert update["trace_events"][0]["event_type"] == (
+        "source_transcript_restored"
+    )
+
+
+@pytest.mark.asyncio
+async def test_structure_phase_rejects_missing_source_transcript() -> None:
+    with pytest.raises(ValueError, match="lost the source transcript"):
+        await _restore_source_transcript_node()(
+            {"transcript": "Canonical structure brief"}
+        )
+'''.replace("\n+", "\n")
          if "test_structure_phase_restores_exact_source_transcript" not in text:
              text = text.rstrip() + addition
          tests.write_text(text, encoding="utf-8")

          ci = Path(".github/workflows/ci.yml")
          text = ci.read_text(encoding="utf-8")
          dollar = "$"
          head_expression = dollar + "{{ github.event.pull_request.head.sha }}"
          validation_expression = (
              dollar
              + "{{ github.event_name == 'pull_request' "
              + "&& github.event.pull_request.head.sha || github.sha }}"
          )

          primary_old = (
              "      - name: Checkout\n"
              "        uses: actions/checkout@v4\n"
          )
          primary_new = (
              "      - name: Checkout exact validation ref\n"
              "        uses: actions/checkout@v4\n"
              "        with:\n"
              f"          ref: {validation_expression}\n"
          )
          if text.count(primary_old) != 1:
              raise SystemExit("primary CI checkout anchor missing")
          text = text.replace(primary_old, primary_new, 1)

          pr_old = (
              "      - name: Checkout exact PR head\n"
              "        uses: actions/checkout@v4\n"
          )
          pr_new = (
              "      - name: Checkout exact PR head\n"
              "        uses: actions/checkout@v4\n"
              "        with:\n"
              f"          ref: {head_expression}\n"
          )
          if text.count(pr_old) != 2:
              raise SystemExit("provider/container checkout anchors missing")
          text = text.replace(pr_old, pr_new)

          postgres_old = (
              "      - name: Checkout exact unified head\n"
              "        uses: actions/checkout@v4\n"
              "        with:\n"
              "          ref: gg-session-14/plus-consolidated\n"
          )
          postgres_new = (
              "      - name: Checkout exact unified head\n"
              "        uses: actions/checkout@v4\n"
              "        with:\n"
              f"          ref: {head_expression}\n"
          )
          if text.count(postgres_old) != 1:
              raise SystemExit("PostgreSQL checkout anchor missing")
          text = text.replace(postgres_old, postgres_new, 1)

          text = text.replace(
              "estimador-cag:" + dollar + "{{ github.sha }}",
              "estimador-cag:" + head_expression,
          )
          text = text.replace(
              "container-readiness-evidence-"
              + dollar
              + "{{ github.sha }}",
              "container-readiness-evidence-" + head_expression,
          )
          secret_old = (
              "'sk-[A-Za-z0-9_-]{20,}|BEGIN "
              "(RSA|OPENSSH|PRIVATE) KEY'"
          )
          secret_new = (
              "'sk-[A-Za-z0-9_-]{20,}|Bearer "
              "[A-Za-z0-9._-]{20,}|BEGIN "
              "(RSA|OPENSSH|PRIVATE) KEY'"
          )
          if text.count(secret_old) != 1:
              raise SystemExit("tracked-secret regex anchor missing")
          text = text.replace(secret_old, secret_new, 1)
          ci.write_text(text, encoding="utf-8")

          Path(
              ".github/workflows/unified-runtime-audit-repair-one-shot.yml"
          ).unlink()
          PY

      - name: Normalize repaired Python
        run: |
          uvx --from ruff==0.15.12 ruff check --fix \
            estimador-cag/app/generation/graph/unified_build.py \
            estimador-cag/tests/test_session13_14_unified_authority.py
          uvx --from ruff==0.15.12 ruff format \
            estimador-cag/app/generation/graph/unified_build.py \
            estimador-cag/tests/test_session13_14_unified_authority.py
          uvx --from ruff==0.15.12 ruff check \
            estimador-cag/app/generation/graph/unified_build.py \
            estimador-cag/tests/test_session13_14_unified_authority.py

      - name: Commit runtime and exact-head repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml
          git add .github/workflows/unified-runtime-audit-repair-one-shot.yml
          git add estimador-cag/app/generation/graph/unified_build.py
          git add estimador-cag/tests/test_session13_14_unified_authority.py
          git commit -m "consolidation: restore source identity and exact-head gates"
          git push origin HEAD:gg-session-14/plus-consolidated
