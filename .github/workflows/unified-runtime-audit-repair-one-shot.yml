name: Unified runtime audit repair one-shot

on:
  push:
    branches:
      - gg-session-14/plus-consolidated
  pull_request:
    branches:
      - gg-session-14/plus
    types:
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout writable consolidation branch
        uses: actions/checkout@v4
        with:
          ref: gg-session-14/plus-consolidated
          fetch-depth: 0

      - name: Install matching Ruff
        uses: astral-sh/setup-uv@v5

      - name: Repair runtime identity and exact-head CI
        run: |
          python - <<'PY'
          from pathlib import Path

          service = Path("estimador-cag/app/services/graph_estimation.py")
          text = service.read_text(encoding="utf-8")
          old = '''    if transcript is not None and state.get("transcript") != transcript:
              raise GraphResultContractError(
                  "graph state transcript does not match the request"
              )
          '''.replace("          ", "")
          new = '''    if transcript is not None:
              state_transcript = state.get("transcript")
              if state_transcript != transcript:
                  source_transcript = state.get(
                      "pre_reformulation_transcript"
                  )
                  reformulated_transcript = state.get(
                      "reformulated_request"
                  )
                  reformulated_identity_valid = (
                      source_transcript == transcript
                      and isinstance(reformulated_transcript, str)
                      and reformulated_transcript == state_transcript
                  )
                  if not reformulated_identity_valid:
                      raise GraphResultContractError(
                          "graph state transcript does not match the request"
                      )
          '''.replace("          ", "")
          if text.count(old) != 1:
              raise SystemExit("expected one transcript identity invariant")
          service.write_text(text.replace(old, new, 1), encoding="utf-8")

          build = Path("estimador-cag/app/generation/graph/unified_build.py")
          text = build.read_text(encoding="utf-8")
          old = "node=build_semantic_classify_node(classifier=semantic_classifier),"
          new = '''node=build_semantic_classify_node(
              classifier=semantic_classifier,
              destination="structure_core",
          ),'''
          if text.count(old) != 1:
              raise SystemExit("expected one unified semantic classifier call")
          build.write_text(text.replace(old, new, 1), encoding="utf-8")

          tests = Path(
              "estimador-cag/tests/test_session13_14_unified_authority.py"
          )
          text = tests.read_text(encoding="utf-8")
          import_line = (
              "from app.services.graph_estimation import (\n"
              "    GraphResultContractError,\n"
              "    _validate_state_identity,\n"
              ")\n"
          )
          marker = (
              "from app.generation.graph.unified_build import "
              "_human_gate_to_supervisor\n"
          )
          if import_line not in text:
              if marker not in text:
                  raise SystemExit("authority test import marker missing")
              text = text.replace(marker, marker + import_line, 1)
          addition = '''
+
+def test_reformulated_transcript_preserves_source_identity() -> None:
+    _validate_state_identity(
+        {
+            "estimation_id": "EST-IDENTITY-1",
+            "graph_version": "session13_14_plus.unified.v1",
+            "transcript": "Canonical brief",
+            "reformulated_request": "Canonical brief",
+            "pre_reformulation_transcript": "Original request",
+        },
+        estimation_id="EST-IDENTITY-1",
+        transcript="Original request",
+        graph_version="session13_14_plus.unified.v1",
+    )
+
+
+@pytest.mark.parametrize(
+    "state_update",
+    [
+        {"pre_reformulation_transcript": "Different request"},
+        {"reformulated_request": "Different canonical brief"},
+        {"reformulated_request": None},
+    ],
+)
+def test_reformulated_transcript_identity_rejects_tampering(
+    state_update: dict[str, object],
+) -> None:
+    state = {
+        "estimation_id": "EST-IDENTITY-2",
+        "graph_version": "session13_14_plus.unified.v1",
+        "transcript": "Canonical brief",
+        "reformulated_request": "Canonical brief",
+        "pre_reformulation_transcript": "Original request",
+        **state_update,
+    }
+
+    with pytest.raises(
+        GraphResultContractError,
+        match="transcript does not match",
+    ):
+        _validate_state_identity(
+            state,
+            estimation_id="EST-IDENTITY-2",
+            transcript="Original request",
+            graph_version="session13_14_plus.unified.v1",
+        )
+'''.replace("\n+", "\n")
          if "test_reformulated_transcript_preserves_source_identity" not in text:
              text = text.rstrip() + addition
          tests.write_text(text, encoding="utf-8")

          ci = Path(".github/workflows/ci.yml")
          text = ci.read_text(encoding="utf-8")
          checkout = '''      - name: Checkout
+        uses: actions/checkout@v4
+'''.replace("+", "")
          exact_checkout = '''      - name: Checkout exact validation ref
+        uses: actions/checkout@v4
+        with:
+          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
+'''.replace("+", "")
          if text.count(checkout) != 1:
              raise SystemExit("expected one primary checkout block")
          text = text.replace(checkout, exact_checkout, 1)

          pr_checkout = '''      - name: Checkout exact PR head
+        uses: actions/checkout@v4
+'''.replace("+", "")
          pr_exact_checkout = '''      - name: Checkout exact PR head
+        uses: actions/checkout@v4
+        with:
+          ref: ${{ github.event.pull_request.head.sha }}
+'''.replace("+", "")
          if text.count(pr_checkout) != 2:
              raise SystemExit("expected provider and container PR checkouts")
          text = text.replace(pr_checkout, pr_exact_checkout)

          branch_checkout = '''      - name: Checkout exact unified head
+        uses: actions/checkout@v4
+        with:
+          ref: gg-session-14/plus-consolidated
+'''.replace("+", "")
          head_checkout = '''      - name: Checkout exact unified head
+        uses: actions/checkout@v4
+        with:
+          ref: ${{ github.event.pull_request.head.sha }}
+'''.replace("+", "")
          if text.count(branch_checkout) != 1:
              raise SystemExit("expected one branch-based PostgreSQL checkout")
          text = text.replace(branch_checkout, head_checkout, 1)

          text = text.replace(
              "estimador-cag:${{ github.sha }}",
              "estimador-cag:${{ github.event.pull_request.head.sha }}",
          )
          text = text.replace(
              "container-readiness-evidence-${{ github.sha }}",
              "container-readiness-evidence-${{ github.event.pull_request.head.sha }}",
          )
          old_secret = (
              "'sk-[A-Za-z0-9_-]{20,}|BEGIN "
              "(RSA|OPENSSH|PRIVATE) KEY'"
          )
          new_secret = (
              "'sk-[A-Za-z0-9_-]{20,}|Bearer "
              "[A-Za-z0-9._-]{20,}|BEGIN "
              "(RSA|OPENSSH|PRIVATE) KEY'"
          )
          if text.count(old_secret) != 1:
              raise SystemExit("expected one tracked-secret regex")
          text = text.replace(old_secret, new_secret, 1)
          ci.write_text(text, encoding="utf-8")

          Path(
              ".github/workflows/unified-runtime-audit-repair-one-shot.yml"
          ).unlink()
          PY

      - name: Normalize repaired Python
        run: |
          uvx --from ruff==0.15.12 ruff check --fix \
            estimador-cag/app/services/graph_estimation.py \
            estimador-cag/app/generation/graph/unified_build.py \
            estimador-cag/tests/test_session13_14_unified_authority.py
          uvx --from ruff==0.15.12 ruff format \
            estimador-cag/app/services/graph_estimation.py \
            estimador-cag/app/generation/graph/unified_build.py \
            estimador-cag/tests/test_session13_14_unified_authority.py
          uvx --from ruff==0.15.12 ruff check \
            estimador-cag/app/services/graph_estimation.py \
            estimador-cag/app/generation/graph/unified_build.py \
            estimador-cag/tests/test_session13_14_unified_authority.py

      - name: Commit runtime and exact-head repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml
          git add .github/workflows/unified-runtime-audit-repair-one-shot.yml
          git add estimador-cag/app/services/graph_estimation.py
          git add estimador-cag/app/generation/graph/unified_build.py
          git add estimador-cag/tests/test_session13_14_unified_authority.py
          git commit -m "consolidation: repair reformulated identity and exact-head gates"
          git push origin HEAD:gg-session-14/plus-consolidated
