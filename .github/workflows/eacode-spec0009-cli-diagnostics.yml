name: EACODE Spec 0009 CLI diagnostics

on:
  pull_request:
    branches:
      - EACODE

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: estimador-cag
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Capture focused pytest diagnostics
        run: |
          uv run pytest -q \
            tests/test_energy_core_secure_execution_cli.py \
            tests/test_energy_core_sandboxed_tool.py \
            > /tmp/pytest-cli.txt 2>&1 || true
          cat /tmp/pytest-cli.txt
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eacode-spec0009-cli-diagnostics
          path: /tmp/pytest-cli.txt
