name: EACORE Neutral Kernel CI

on:
  push:
    branches:
      - EACORE
  pull_request:
    paths:
      - "packages/eacore/**"
      - ".github/workflows/eacore-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eacore-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  neutral-kernel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/eacore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Compile
        run: python -m compileall -q src tests
      - name: Tests
        run: pytest
      - name: Repository cleanliness
        working-directory: .
        run: |
          if test -n "$(git status --short)"; then
            git status --short
            echo "Repository is dirty after EACORE CI"
            exit 1
          fi
          echo "Repository stayed clean"
