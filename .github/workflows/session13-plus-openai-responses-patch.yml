name: Session 13 Plus OpenAI Responses integration

on:
  push:
    branches:
      - gg-session-13/plus-production-readiness
    paths:
      - scripts/apply_openai_responses_readiness.py
      - .github/workflows/session13-plus-openai-responses-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout readiness branch
        uses: actions/checkout@v4
        with:
          ref: gg-session-13/plus-production-readiness

      - name: Apply exact provider patch
        run: python scripts/apply_openai_responses_readiness.py

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: estimador-cag
        run: uv sync --frozen --extra dev

      - name: Ruff and compile
        working-directory: estimador-cag
        run: |
          uv run ruff check --fix \
            app/services/openai_responses_agent.py \
            app/services/provider_readiness.py \
            app/services/stage_routing_runtime.py \
            scripts/provider_readiness_benchmark.py \
            tests/test_session13_plus_provider_readiness.py \
            tests/test_session13_plus_stage_routing_runtime.py
          uv run ruff check app tests evals streamlit_app.py scripts
          uv run python -m py_compile $(find app tests evals scripts -name '*.py' -type f)

      - name: Deterministic tests
        working-directory: estimador-cag
        env:
          OPENAI_API_KEY: test
          DEEPSEEK_API_KEY: test
          KIMI_API_KEY: test
        run: uv run pytest -q -m "not live_provider"

      - name: Diff and secret gates
        run: |
          git diff --check
          if git diff | grep -E 'sk-[A-Za-z0-9_-]{20,}|BEGIN (RSA|OPENSSH|PRIVATE) KEY'; then
            echo "Potential secret in patch diff"
            false
          fi

      - name: Commit validated integration
        run: |
          rm -f scripts/apply_openai_responses_readiness.py
          git config user.name "GPT-5.6 Readiness"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git commit -m "session13: feat(readiness): use OpenAI Responses for tool stages"
          git push origin HEAD:gg-session-13/plus-production-readiness
