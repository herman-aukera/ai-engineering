name: Energy Aware Chat Live Provider Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: energy-aware-chat-live-provider-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-provider-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: estimador-cag
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
      OPENAI_API_KEY: test
      PYTHONUNBUFFERED: "1"
      UV_HTTP_TIMEOUT: "600"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.16"

      - name: Verify live provider secrets are present
        run: |
          test -n "$DEEPSEEK_API_KEY" || { echo "Missing DEEPSEEK_API_KEY secret"; exit 1; }
          test -n "$KIMI_API_KEY" || { echo "Missing KIMI_API_KEY secret"; exit 1; }

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run Energy Chat live provider smoke
        run: uv run python scripts/live_energy_chat_provider_smoke.py
