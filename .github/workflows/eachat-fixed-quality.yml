name: EACHAT - Fixed Quality

on:
  pull_request:
    paths:
      - estimador-cag/app/energy_chat/**
      - estimador-cag/evals/energy_chat/fixed_benchmark_cases.jsonl
      - estimador-cag/scripts/run_eachat_fixed_quality.py
      - estimador-cag/tests/test_energy_chat_fixed_benchmark.py
      - .github/workflows/eachat-fixed-quality.yml
  push:
    branches:
      - EACHAT
      - repair/eachat-foundation-and-release-evidence
    paths:
      - estimador-cag/app/energy_chat/**
      - estimador-cag/evals/energy_chat/fixed_benchmark_cases.jsonl
      - estimador-cag/scripts/run_eachat_fixed_quality.py
      - estimador-cag/tests/test_energy_chat_fixed_benchmark.py
      - .github/workflows/eachat-fixed-quality.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-fixed-corpus:
    runs-on: ubuntu-latest
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      OPENAI_API_KEY: test
      DEEPSEEK_API_KEY: test
      KIMI_API_KEY: test
      LANGGRAPH_STRICT_MSGPACK: "true"
      PYTHONUNBUFFERED: "1"
      UV_HTTP_TIMEOUT: "300"
    defaults:
      run:
        working-directory: estimador-cag
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ env.EXPECTED_HEAD_SHA }}

      - name: Verify exact checked-out SHA
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.16"

      - name: Install deterministic environment
        run: uv sync --frozen --extra dev

      - name: Run focused quality contracts
        run: uv run pytest -q tests/test_energy_chat_fixed_benchmark.py

      - name: Generate fixed-corpus quality evidence
        run: uv run python scripts/run_eachat_fixed_quality.py

      - name: Upload fixed-corpus quality evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eachat-fixed-quality-evidence
          path: |
            /tmp/eachat-fixed-quality.json
            /tmp/eachat-fixed-quality.md
          if-no-files-found: warn
