name: EACHAT - Container Canary

on:
  pull_request:
    paths:
      - estimador-cag/app/energy_chat/**
      - estimador-cag/docs/energy_chat_v2_demo.html
      - estimador-cag/deploy/eachat/**
      - estimador-cag/scripts/canary_eachat_container.py
      - estimador-cag/scripts/session15_eachat_production_contract.py
      - estimador-cag/tests/test_eachat_session15_production_contract.py
      - estimador-cag/tests/test_eachat_ci_contract.py
      - estimador-cag/tests/test_eachat_identity_ownership.py
      - estimador-cag/tests/smoke/test_eachat_production_smoke.py
      - .github/workflows/energy-chat-ci.yml
      - .github/workflows/eachat-container-canary.yml
  push:
    branches:
      - EACHAT
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-restart-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EACHAT_CANARY_BASE_URL: http://127.0.0.1:8010
      EACHAT_CANARY_EVIDENCE: /tmp/eachat-canary
      PYTHONUNBUFFERED: "1"
      UV_HTTP_TIMEOUT: "300"
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.EXPECTED_HEAD_SHA }}

      - name: Verify exact checked-out SHA
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Verify and export isolated production lock
        working-directory: estimador-cag
        run: |
          uv lock --project deploy/eachat --check
          cd deploy/eachat
          sha256sum --check uv.lock.sha256
          cd ../..
          uv export --project deploy/eachat --frozen --no-dev --format requirements-txt --output-file deploy/eachat/requirements.generated.txt

      - name: Generate masked runtime secrets
        run: |
          MEMORY_KEY=$(python -c "import base64,secrets; print(base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())")
          SESSION_KEY=$(python -c "import secrets; print(secrets.token_urlsafe(48))")
          echo "::add-mask::$MEMORY_KEY"
          echo "::add-mask::$SESSION_KEY"
          printf 'EACHAT_MEMORY_ENCRYPTION_KEY=%s\n' "$MEMORY_KEY" >> "$GITHUB_ENV"
          printf 'EACHAT_SESSION_SIGNING_KEY=%s\n' "$SESSION_KEY" >> "$GITHUB_ENV"

      - name: Build isolated non-root image
        working-directory: estimador-cag
        run: docker build --file deploy/eachat/Dockerfile --tag "eachat-canary:${EXPECTED_HEAD_SHA}" .

      - name: Start PostgreSQL and first application container
        run: |
          docker network create eachat-canary-network
          docker run --detach --name eachat-postgres --network eachat-canary-network \
            --env POSTGRES_USER=eachat \
            --env POSTGRES_PASSWORD=eachat_test \
            --env POSTGRES_DB=eachat_test \
            postgres:16
          POSTGRES_READY=0
          for attempt in $(seq 1 45); do
            if docker exec eachat-postgres pg_isready -U eachat -d eachat_test; then
              POSTGRES_READY=1
              break
            fi
            sleep 1
          done
          test "$POSTGRES_READY" = "1"
          docker run --detach --name eachat-app --network eachat-canary-network \
            --publish 8010:8000 \
            --env GIT_SHA="$EXPECTED_HEAD_SHA" \
            --env LANGGRAPH_STRICT_MSGPACK=true \
            --env EACHAT_POSTGRES_URL=postgresql://eachat:eachat_test@eachat-postgres:5432/eachat_test \
            --env EACHAT_MEMORY_ENCRYPTION_KEY="$EACHAT_MEMORY_ENCRYPTION_KEY" \
            --env EACHAT_SESSION_SIGNING_KEY="$EACHAT_SESSION_SIGNING_KEY" \
            "eachat-canary:${EXPECTED_HEAD_SHA}"
          APP_READY=0
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8010/ready > /tmp/eachat-canary-ready-first.json; then
              APP_READY=1
              break
            fi
            sleep 1
          done
          test "$APP_READY" = "1"
          curl -fsS http://127.0.0.1:8010/startup > /tmp/eachat-canary-startup-first.json
          curl -fsS http://127.0.0.1:8010/health > /tmp/eachat-canary-health-first.json
          curl -fsS http://127.0.0.1:8010/version > /tmp/eachat-canary-version-first.json
          test "$(docker exec eachat-app id -u)" != "0"

      - name: Verify first production lifecycle contract
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = os.environ['EXPECTED_HEAD_SHA']
          startup = json.loads(Path('/tmp/eachat-canary-startup-first.json').read_text())
          ready = json.loads(Path('/tmp/eachat-canary-ready-first.json').read_text())
          version = json.loads(Path('/tmp/eachat-canary-version-first.json').read_text())
          assert startup == {'status': 'started', 'started': True}
          assert ready['status'] == 'ready'
          assert ready['ready'] is True
          assert ready['restart_persistent'] is True
          assert ready['conversation_restart_persistent'] is True
          assert ready['ownership_restart_persistent'] is True
          assert ready['identity_required'] is True
          assert ready['strict_msgpack'] is True
          assert version['git_sha'] == expected
          PY

      - name: Seed durable owned two-turn conversation
        working-directory: estimador-cag
        run: uv run python -m scripts.canary_eachat_container seed

      - name: Recreate application container against the same database
        run: |
          docker logs eachat-app > /tmp/eachat-app-first.log 2>&1
          docker rm --force eachat-app
          docker run --detach --name eachat-app --network eachat-canary-network \
            --publish 8010:8000 \
            --env GIT_SHA="$EXPECTED_HEAD_SHA" \
            --env LANGGRAPH_STRICT_MSGPACK=true \
            --env EACHAT_POSTGRES_URL=postgresql://eachat:eachat_test@eachat-postgres:5432/eachat_test \
            --env EACHAT_MEMORY_ENCRYPTION_KEY="$EACHAT_MEMORY_ENCRYPTION_KEY" \
            --env EACHAT_SESSION_SIGNING_KEY="$EACHAT_SESSION_SIGNING_KEY" \
            "eachat-canary:${EXPECTED_HEAD_SHA}"
          APP_READY=0
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8010/ready > /tmp/eachat-canary-ready-restarted.json; then
              APP_READY=1
              break
            fi
            sleep 1
          done
          test "$APP_READY" = "1"
          curl -fsS http://127.0.0.1:8010/startup > /tmp/eachat-canary-startup-restarted.json
          curl -fsS http://127.0.0.1:8010/health > /tmp/eachat-canary-health-restarted.json
          curl -fsS http://127.0.0.1:8010/version > /tmp/eachat-canary-version-restarted.json
          test "$(docker exec eachat-app id -u)" != "0"

      - name: Verify restarted production lifecycle contract
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = os.environ['EXPECTED_HEAD_SHA']
          ready = json.loads(Path('/tmp/eachat-canary-ready-restarted.json').read_text())
          version = json.loads(Path('/tmp/eachat-canary-version-restarted.json').read_text())
          assert ready['ready'] is True
          assert ready['restart_persistent'] is True
          assert ready['conversation_restart_persistent'] is True
          assert ready['ownership_restart_persistent'] is True
          assert ready['identity_required'] is True
          assert ready['strict_msgpack'] is True
          assert version['git_sha'] == expected
          PY

      - name: Verify restart recovery and ownership
        working-directory: estimador-cag
        run: uv run python -m scripts.canary_eachat_container verify

      - name: Run bounded authenticated HTTP load
        working-directory: estimador-cag
        run: uv run python -m scripts.canary_eachat_container load

      - name: Delete canary conversation
        working-directory: estimador-cag
        run: uv run python -m scripts.canary_eachat_container cleanup

      - name: Verify strict checkpoint deserialization
        run: |
          docker logs eachat-app > /tmp/eachat-app-restarted.log 2>&1
          if grep -E 'Blocked deserialization|not in allowed_msgpack_modules|Deserializing unregistered type' /tmp/eachat-app-first.log /tmp/eachat-app-restarted.log; then
            echo "Strict checkpoint serializer rejected or warned on an EACHAT state type."
            false
          fi

      - name: Capture container evidence
        if: always()
        run: |
          mkdir -p /tmp/eachat-canary
          docker logs eachat-app > /tmp/eachat-canary/app-restarted.log 2>&1 || true
          docker logs eachat-postgres > /tmp/eachat-canary/postgres.log 2>&1 || true
          docker image inspect "eachat-canary:${EXPECTED_HEAD_SHA}" > /tmp/eachat-canary/image-inspect.json 2>/dev/null || true
          cp /tmp/eachat-canary-*.json /tmp/eachat-canary/ 2>/dev/null || true
          cp /tmp/eachat-app-first.log /tmp/eachat-canary/app-first.log 2>/dev/null || true
          cp /tmp/eachat-app-restarted.log /tmp/eachat-canary/app-restarted.log 2>/dev/null || true

      - name: Upload container canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eachat-container-canary-${{ env.EXPECTED_HEAD_SHA }}
          path: /tmp/eachat-canary
          if-no-files-found: error
          retention-days: 14

      - name: Stop canary containers
        if: always()
        run: |
          docker rm --force eachat-app 2>/dev/null || true
          docker rm --force eachat-postgres 2>/dev/null || true
          docker network rm eachat-canary-network 2>/dev/null || true
