name: Release immutable estimator image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  release-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable SHA image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: estimador-cag
          file: estimador-cag/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/estimador-cag:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Emit deploy identity
        run: |
          echo "image=ghcr.io/${{ github.repository_owner }}/estimador-cag@${{ steps.build.outputs.digest }}"
          echo "commit=${{ github.sha }}"
