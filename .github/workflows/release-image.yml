name: Release immutable estimator image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  release-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact checked-out SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify and export isolated production lock
        working-directory: estimador-cag
        run: python scripts/estimator_export_production_requirements.py

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push immutable SHA image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: estimador-cag
          file: estimador-cag/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/estimador-cag:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Emit deploy identity
        run: |
          echo "image=ghcr.io/${{ github.repository_owner }}/estimador-cag@${{ steps.build.outputs.digest }}"
          echo "commit=${{ github.sha }}"
