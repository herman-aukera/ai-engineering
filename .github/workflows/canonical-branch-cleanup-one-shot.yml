name: One-shot canonical branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/canonical-branch-cleanup-one-shot.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact main head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Fetch all branch heads
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

      - name: Delete every noncanonical branch head
        run: |
          set -euo pipefail
          mapfile -t branches < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin | sed 's#^origin/##' | grep -v '^HEAD$')
          for branch in "${branches[@]}"; do
            case "$branch" in
              main|EACHAT|EACODE) ;;
              *)
                echo "Deleting historical branch: $branch"
                git push origin --delete "$branch"
                ;;
            esac
          done

      - name: Verify exactly three canonical branches remain
        run: |
          git fetch origin --prune
          mapfile -t remaining < <(git ls-remote --heads origin | awk '{sub("refs/heads/", "", $2); print $2}' | sort)
          printf '%s\n' "${remaining[@]}"
          expected=$'EACHAT\nEACODE\nmain'
          actual="$(printf '%s\n' "${remaining[@]}")"
          test "$actual" = "$expected"

      - name: Remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/canonical-branch-cleanup-one-shot.yml
          git commit -m "main: chore(repo): remove one-shot canonical branch cleanup"
          git push origin HEAD:main
