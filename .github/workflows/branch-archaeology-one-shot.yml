name: One-shot branch archaeology

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/branch-archaeology-one-shot.yml

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Fetch all branch heads
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

      - name: Build archaeology report
        run: |
          python - <<'PY'
          from __future__ import annotations
          import datetime as dt
          import subprocess
          from pathlib import Path

          canon = ('main', 'EACHAT', 'EACODE')
          def git(*args: str, check: bool = True) -> str:
              p = subprocess.run(['git', *args], check=check, capture_output=True, text=True)
              return p.stdout.strip()
          branches = [
              line.removeprefix('origin/')
              for line in git('for-each-ref', '--format=%(refname:short)', 'refs/remotes/origin').splitlines()
              if line and line != 'origin/HEAD'
          ]
          rows = []
          details = []
          for branch in sorted(branches):
              if branch in canon:
                  continue
              ref = f'origin/{branch}'
              head = git('rev-parse', ref)
              captured = []
              for target in canon:
                  rc = subprocess.run(['git','merge-base','--is-ancestor',head,f'origin/{target}']).returncode
                  if rc == 0:
                      captured.append(target)
              counts = {target: int(git('rev-list','--count',f'origin/{target}..{ref}')) for target in canon}
              nearest = min(canon, key=lambda item: counts[item])
              last = git('log','-1','--format=%cs | %s',ref).replace('|','/').replace('\n',' ')
              rows.append((branch, head[:12], ','.join(captured) or 'UNIQUE', counts['main'], counts['EACHAT'], counts['EACODE'], nearest, last))
              if not captured:
                  log = git('log','--format=%h %cs %s',f'origin/{nearest}..{ref}','-n','12')
                  files = git('diff','--name-only',f'origin/{nearest}...{ref}').splitlines()
                  details.append((branch, nearest, counts[nearest], files[:40], log))

          lines = [
              '# Branch Archaeology — 2026-08-21',
              '',
              'Generated from Git ancestry before deleting historical heads. Canonical branches are `main`, `EACHAT`, and `EACODE`.',
              '',
              '| Branch | Head | Captured by canonical ancestry | Unique vs main | Unique vs EACHAT | Unique vs EACODE | Nearest | Last commit |',
              '| --- | --- | --- | ---: | ---: | ---: | --- | --- |',
          ]
          for row in rows:
              lines.append('| ' + ' | '.join(map(str,row)) + ' |')
          lines += ['', '## Branches with non-ancestor commits', '']
          if not details:
              lines.append('None. Every historical branch head is already reachable from at least one canonical branch.')
          for branch, nearest, count, files, log in details:
              lines += [
                  f'### `{branch}`', '',
                  f'- nearest canonical line: `{nearest}`',
                  f'- commits not reachable from that canonical head: **{count}**',
                  f'- changed files from merge-base: **{len(files)} shown / capped at 40**', '',
                  'Files:', '',
                  *[f'- `{path}`' for path in files], '',
                  'Recent unique commits:', '', '```text', log or '(none)', '```', '',
              ]
          lines += [
              '## Deletion policy', '',
              'A historical branch may be deleted after useful unique work is either already represented by a canonical product, explicitly retained as historical evidence, or deliberately rejected as superseded/unsafe. Git history and closed PRs remain the historical record; dead runtime source is not copied into archive folders.', '',
              f'Generated at {dt.datetime.now(dt.UTC).isoformat()}.',
          ]
          path = Path('estimador-cag/docs/history/BRANCH_ARCHAEOLOGY_2026-08-21.md')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Commit report and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estimador-cag/docs/history/BRANCH_ARCHAEOLOGY_2026-08-21.md
          git rm .github/workflows/branch-archaeology-one-shot.yml
          git diff --cached --check
          git commit -m "main: docs(history): record branch archaeology before cleanup"
          git push origin HEAD:main
