name: EACORE one-shot bootstrap

on:
  push:
    branches:
      - EACORE
    paths:
      - .github/workflows/eacore-bootstrap.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/eacore-bootstrap.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'EACORE' || github.ref_name == 'EACORE'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated EACORE branch
        uses: actions/checkout@v4
        with:
          ref: EACORE
          fetch-depth: 0

      - name: Verify payload integrity
        env:
          EXPECTED_SHA256: 5f68faa901dadae0c6fd4ac9f19fa6ec32add6093a541d24ef0b91cc515cbfd9
        run: |
          cat .eacore-bootstrap/chunk-*.b64 > /tmp/eacore-payload.b64
          base64 --decode /tmp/eacore-payload.b64 > /tmp/eacore-payload.tar.gz
          echo "${EXPECTED_SHA256}  /tmp/eacore-payload.tar.gz" | sha256sum --check -

      - name: Extract bounded payload
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile

          archive = Path("/tmp/eacore-payload.tar.gz")
          root = Path(".").resolve()
          with tarfile.open(archive, "r:gz") as payload:
              for member in payload.getmembers():
                  target = (root / member.name).resolve()
                  target.relative_to(root)
              payload.extractall(root)
          PY

      - name: Normalize documentation and stage source
        run: |
          python - <<'PY'
          from pathlib import Path

          for path in Path("packages/eacore").rglob("*.md"):
              text = path.read_text(encoding="utf-8")
              normalized = "\n".join(line.rstrip() for line in text.splitlines()) + "\n"
              path.write_text(normalized, encoding="utf-8")
          PY
          rm -rf .eacore-bootstrap
          rm -f .github/workflows/eacore-bootstrap.yml
          git add -A
          git diff --cached --check

      - name: Commit neutral kernel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "eacore: feat(kernel): add neutral kernel 0.1"

      - name: Push isolated EACORE head
        run: git push origin HEAD:EACORE
