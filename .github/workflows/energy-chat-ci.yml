name: Energy Aware Chat CI

on:
  push:
    branches:
      - EACHAT
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: energy-aware-chat-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  energy-chat-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: estimador-cag
    env:
      EXPECTED_HEAD_SHA: ${{ github.sha }}
      DEEPSEEK_API_KEY: test
      KIMI_API_KEY: test
      OPENAI_API_KEY: test
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ env.EXPECTED_HEAD_SHA }}

      - name: Verify exact checked-out SHA
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.16"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Energy Chat deterministic validation gate
        run: bash scripts/validate_energy_chat.sh

      - name: Session 15 production contract tests
        run: uv run pytest -q tests/test_eachat_session15_production_contract.py tests/test_eachat_ci_contract.py

      - name: Keyless production HTTP smoke tests
        run: uv run pytest -q tests/smoke/test_eachat_production_smoke.py

      - name: Session 15 production contract executable
        run: uv run python scripts/session15_eachat_production_contract.py

      - name: Verify isolated production dependency lock
        run: |
          uv lock --project deploy/eachat --check
          cd deploy/eachat
          sha256sum --check uv.lock.sha256

      - name: Secret and diff gates
        working-directory: .
        run: |
          git diff --check
          matches="$(git grep -n -E 'sk-[A-Za-z0-9_-]{20,}|Bearer [A-Za-z0-9._-]{20,}|BEGIN (RSA|OPENSSH|PRIVATE) KEY' -- . ':!*.lock' || true)"
          unapproved="$(printf '%s\n' "$matches" | grep -v '# test-secret-fixture' || true)"
          if [ -n "$unapproved" ]; then
            echo "Potential secret in tracked files"
            printf '%s\n' "$unapproved" | cut -d: -f1-2
            false
          fi
