name: Session 13 Plus readiness Ruff normalization

on:
  push:
    branches:
      - gg-session-13/plus-production-readiness
    paths:
      - .github/workflows/session13-plus-readiness-autofix.yml
      - estimador-cag/app/config.py
      - estimador-cag/app/main.py
      - estimador-cag/app/routers/readiness.py
      - estimador-cag/app/schemas/provider_readiness.py
      - estimador-cag/app/schemas/v3_registry.py
      - estimador-cag/app/schemas/v3_routing.py
      - estimador-cag/app/services/production_readiness.py
      - estimador-cag/app/services/provider_readiness.py
      - estimador-cag/app/services/stage_routing_runtime.py
      - estimador-cag/app/ui/provider_selector.py
      - estimador-cag/app/generation/graph/observability.py
      - estimador-cag/app/generation/graph/review_state.py
      - estimador-cag/app/generation/graph/reviewed_runtime.py
      - estimador-cag/scripts/provider_readiness_benchmark.py
      - estimador-cag/tests/test_session13_plus_production_readiness.py
      - estimador-cag/tests/test_session13_plus_provider_readiness.py
      - estimador-cag/tests/test_session13_plus_stage_routing_runtime.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout readiness branch
        uses: actions/checkout@v4
        with:
          ref: gg-session-13/plus-production-readiness

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: estimador-cag
        run: uv sync --frozen --extra dev

      - name: Apply safe Ruff fixes
        working-directory: estimador-cag
        run: |
          uv run ruff check --fix \
            app/config.py \
            app/main.py \
            app/routers/readiness.py \
            app/schemas/provider_readiness.py \
            app/schemas/v3_registry.py \
            app/schemas/v3_routing.py \
            app/services/production_readiness.py \
            app/services/provider_readiness.py \
            app/services/stage_routing_runtime.py \
            app/ui/provider_selector.py \
            app/generation/graph/observability.py \
            app/generation/graph/review_state.py \
            app/generation/graph/reviewed_runtime.py \
            scripts/provider_readiness_benchmark.py \
            tests/test_session13_plus_production_readiness.py \
            tests/test_session13_plus_provider_readiness.py \
            tests/test_session13_plus_stage_routing_runtime.py
          uv run ruff check app tests evals streamlit_app.py > /tmp/readiness-ruff.log 2>&1 || {
            cat /tmp/readiness-ruff.log
            false
          }
          uv run python -m py_compile $(find app tests evals -name '*.py' -type f)

      - name: Persist Ruff failure
        if: failure()
        run: |
          cp /tmp/readiness-ruff.log .readiness-ruff-error.log
          git config user.name "GPT-5.6 Readiness"
          git config user.email "actions@users.noreply.github.com"
          git add .readiness-ruff-error.log
          if git diff --cached --quiet; then
            echo "Ruff diagnostic unchanged"
          else
            git commit -m "chore(readiness): capture Ruff failure"
            git push origin HEAD:gg-session-13/plus-production-readiness
          fi

      - name: Commit normalization
        if: success()
        run: |
          rm -f .readiness-ruff-error.log
          git config user.name "GPT-5.6 Readiness"
          git config user.email "actions@users.noreply.github.com"
          git add estimador-cag .readiness-ruff-error.log
          if git diff --cached --quiet; then
            echo "No Ruff normalization changes"
          else
            git commit -m "session13: chore(readiness): normalize production surface"
            git push origin HEAD:gg-session-13/plus-production-readiness
          fi
