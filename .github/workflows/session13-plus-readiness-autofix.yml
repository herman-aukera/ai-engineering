name: Session 13 Plus readiness Ruff normalization

on:
  push:
    branches:
      - gg-session-13/plus-production-readiness
    paths:
      - .github/workflows/session13-plus-readiness-autofix.yml
      - estimador-cag/app/config.py
      - estimador-cag/app/schemas/provider_readiness.py
      - estimador-cag/app/services/provider_readiness.py
      - estimador-cag/app/services/stage_routing_runtime.py
      - estimador-cag/app/generation/graph/observability.py
      - estimador-cag/app/generation/graph/review_state.py
      - estimador-cag/app/generation/graph/reviewed_runtime.py
      - estimador-cag/tests/test_session13_plus_provider_readiness.py
      - estimador-cag/tests/test_session13_plus_stage_routing_runtime.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout readiness branch
        uses: actions/checkout@v4
        with:
          ref: gg-session-13/plus-production-readiness

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: estimador-cag
        run: uv sync --frozen --extra dev

      - name: Apply safe Ruff fixes
        working-directory: estimador-cag
        run: |
          uv run ruff check --fix \
            app/config.py \
            app/schemas/provider_readiness.py \
            app/services/provider_readiness.py \
            app/services/stage_routing_runtime.py \
            app/generation/graph/observability.py \
            app/generation/graph/review_state.py \
            app/generation/graph/reviewed_runtime.py \
            tests/test_session13_plus_provider_readiness.py \
            tests/test_session13_plus_stage_routing_runtime.py
          uv run ruff check app tests evals streamlit_app.py
          uv run python -m py_compile $(find app tests evals -name '*.py' -type f)

      - name: Commit normalization
        run: |
          git config user.name "GPT-5.6 Readiness"
          git config user.email "actions@users.noreply.github.com"
          git add estimador-cag
          if git diff --cached --quiet; then
            echo "No Ruff normalization changes"
          else
            git commit -m "session13: chore(readiness): normalize routed runtime"
            git push origin HEAD:gg-session-13/plus-production-readiness
          fi
