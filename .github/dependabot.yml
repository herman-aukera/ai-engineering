version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 3

  - package-ecosystem: "pip"
    directory: "/estimador-cag"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 3

  - package-ecosystem: "docker"
    directory: "/estimador-cag"
    schedule:
      interval: "weekly"
    groups:
      runtime-images:
        patterns:
          - "*"
    open-pull-requests-limit: 3
